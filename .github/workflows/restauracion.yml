# Prueba de restauración (TA-263; 02 ADR-22 y CT-09; 03 §12.2; 04 §16.1, §16.2, §16.4; 07 §31.1, §32.3, §32.4; CH-68).
# Restaura el último respaldo diario de B2 en un PostgreSQL efímero del runner, sin `auth` ni roles de Supabase, con
# `restaurar.sh` (pasos 2 a 10 de 03 §12.2) y, al final, registra la restauración (OPT-09, paso 11). Nunca se
# condiciona ni depende de otro workflow (07 §32.3). Sin `if:` ni `continue-on-error`: un paso que falla corta el job,
# GitHub envía el correo y OPT-09 no se llama; a los 35 días, la tarea diaria avisa de la restauración atrasada.
# Corre con el código y el catálogo del commit desplegado (la última etiqueta de `desplegar`), no con los de main,
# que puede ir adelante. El volcado en claro y la clave privada no salen del runner y nunca van a los logs (07 §32.4).
name: restauracion

on:
  schedule:
    # CT-09: semanal durante las 8 semanas desde la apertura de la puerta; se quita en TU-18 (07 §31.4). Va primero:
    # la reserva pendiente del mes se calcula con el primer cron (07 §32.3)
    - cron: '0 9 * * 0'
    # ADR-22, 04 §16.1: día 1 de cada mes
    - cron: '0 9 1 * *'
  workflow_dispatch:

concurrency:
  group: respaldo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restauracion:
    name: restauracion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Historia y etiquetas: el código y el catálogo del commit desplegado en producción
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: desplegado
        run: |
          etiqueta=$(git tag --list --sort=-v:refname 'desplegado-*' | head -n 1)
          test -n "$etiqueta"
          git checkout -q --detach "$etiqueta"
          echo "código y catálogo de $etiqueta"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 04 §16.2: la CLI `aws` ya viene en la imagen del runner; `age` y el cliente de PGDG se instalan
      - id: herramientas
        run: |
          . infra/versiones.env
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq "postgresql-client-${PG_MAYOR}"
          echo "/usr/lib/postgresql/${PG_MAYOR}/bin" >> "$GITHUB_PATH"
          aws --version
      # 04 §16.1: postgres:<versión mayor del proyecto>, por digest (CH-22: ECR con 3 intentos o el espejo de Google).
      # Vacío: sin `auth` ni los roles de Supabase (ADR-22). La clave es del contenedor y muere con el runner.
      - id: pg-efimero
        run: |
          set -euo pipefail
          . infra/versiones.env
          origen=""
          for i in 1 2 3; do
            if docker pull -q "public.ecr.aws/docker/library/postgres@${PG_IMAGEN_DIGEST}"; then
              origen="public.ecr.aws/docker/library/postgres"; break
            fi
            sleep $((i * 15))
          done
          if [ -z "$origen" ]; then
            origen="mirror.gcr.io/library/postgres"
            docker pull -q "${origen}@${PG_IMAGEN_DIGEST}"
          fi
          clave=$(openssl rand -hex 16)
          echo "::add-mask::$clave"
          docker run -d --name finn-restauracion -e POSTGRES_PASSWORD="$clave" -p 127.0.0.1:5432:5432 \
            "${origen}@${PG_IMAGEN_DIGEST}" >/dev/null
          # Listo cuando acepta TCP: el servidor temporal de la inicialización solo escucha el socket
          for i in $(seq 1 60); do pg_isready -q -h 127.0.0.1 -p 5432 && break; sleep 2; done
          pg_isready -h 127.0.0.1 -p 5432
          { echo "PGHOST=127.0.0.1"; echo "PGPORT=5432"; echo "PGUSER=postgres"; echo "PGPASSWORD=$clave"; } >> "$GITHUB_ENV"
      # 03 §12.2 paso 1: el último `diarios/AAAA-MM-DD` con su manifiesto (CH-68: B2 por su API S3)
      - id: bajar
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          if [[ ! "$B2_ENDPOINT" =~ ^https://s3\.([a-z0-9-]+)\.backblazeb2\.com/?$ ]]; then
            echo 'B2_ENDPOINT no es https://s3.<región>.backblazeb2.com'; exit 1
          fi
          export AWS_ACCESS_KEY_ID="$B2_KEY_ID" AWS_SECRET_ACCESS_KEY="$B2_APPLICATION_KEY"
          export AWS_DEFAULT_REGION="${BASH_REMATCH[1]}"
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          dir="$RUNNER_TEMP/restauracion"
          mkdir -p "$dir"
          ultimo=$(aws s3 ls "s3://$B2_BUCKET/diarios/" --endpoint-url "$B2_ENDPOINT" | awk '{print $4}' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.dump\.age$' | sort | tail -n 1)
          fecha=${ultimo%.dump.age}
          for s in dump.age manifiesto.json.age; do
            aws s3 cp --only-show-errors --endpoint-url "$B2_ENDPOINT" "s3://$B2_BUCKET/diarios/$fecha.$s" "$dir/finn.$s"
          done
          echo "fecha=$fecha" >> "$GITHUB_OUTPUT"
          echo "último respaldo: diarios/$fecha"
      # ADR-22: la clave privada de `age` solo en este paso, en un archivo que se borra al salir
      - id: descifrar
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/restauracion"
          trap 'rm -f "$dir/clave.txt"' EXIT
          umask 077
          printf '%s\n' "$AGE_PRIVATE_KEY" > "$dir/clave.txt"
          for s in dump manifiesto.json; do
            age -d -i "$dir/clave.txt" -o "$dir/finn.$s" "$dir/finn.$s.age"
            rm "$dir/finn.$s.age"
          done
      # 03 §12.2 pasos 2 a 10 y 04 §16.4: el motor calcula con `hoy` = la fecha del volcado
      - id: restaurar
        run: >-
          tools/respaldo/restaurar.sh "$RUNNER_TEMP/restauracion/finn.dump"
          "$RUNNER_TEMP/restauracion/finn.manifiesto.json" packages/db/prisma/catalogo-esperado.txt
          finn_restaurada "${{ steps.bajar.outputs.fecha }}"
      # 03 §12.2 paso 11 y 04 §16.4: OPT-09 → estado_respaldo.ultima_restauracion_en; cuerpo vacío
      - id: registrar
        env:
          FINN_URL: ${{ secrets.FINN_URL }}
          RESPALDO_SECRET: ${{ secrets.RESPALDO_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -X POST -H "authorization: Bearer $RESPALDO_SECRET" \
            -H 'content-type: application/json' --data '{}' "${FINN_URL%/}/api/respaldo/restauracion"
          echo "restauración registrada"
