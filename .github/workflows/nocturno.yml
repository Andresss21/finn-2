# Nocturno (TA-013; 07 §6.1, §6.5 M4, §32.3; P7-14; CH-02). `minutos` corre siempre, antes de mirar si main cambió:
# suma los jobs del mes, decide el modo, lo guarda en la caché (ci-modo-AAAAMM-<run_id>, que ci.yml restaura) y sube el
# uso por job como artefacto minutos-AAAAMM (90 días). Las suites se agregan como jobs a medida que existen
# (escritorio, zona-distinta, webkit-parcial, SW, REN, RES, mutantes): dependen de `minutos` y corren con `correr`.
name: nocturno

on:
  schedule:
    - cron: '15 8 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: nocturno
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  minutos:
    name: minutos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Solo este job lee la API de ejecuciones (6.5: sin token personal)
    permissions:
      contents: read
      actions: read
    outputs:
      correr: ${{ steps.minutos.outputs.correr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      # El estado anterior: lleva la última corrida de las suites y FINN_REN_ROJO de un mes al otro
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/ci-modo
          key: ci-modo-${{ github.run_id }}
          restore-keys: ci-modo-
      - id: minutos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/minutos.ts calcular
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/ci-modo
          key: ci-modo-${{ steps.minutos.outputs.mes }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minutos-${{ steps.minutos.outputs.mes }}
          path: test-results/minutos/
          retention-days: 90

  prop:
    name: prop
    needs: minutos
    if: needs.minutos.outputs.correr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FC_RUNS: '10000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:nocturno
