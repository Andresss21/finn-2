# Nocturno (TA-013; 07 §6.1, §6.5 M4, §32.3; P7-14; CH-02). `minutos` corre siempre, antes de mirar si main cambió:
# suma los jobs del mes, decide el modo, lo guarda en la caché (ci-modo-AAAAMM-<run_id>, que ci.yml restaura) y sube el
# uso por job como artefacto minutos-AAAAMM (90 días). Las suites se agregan como jobs a medida que existen
# (escritorio, zona-distinta, webkit-parcial, SW, RES): dependen de `minutos` y corren con `correr`. `ren` (TA-156)
# mide los presupuestos de tiempo del motor (07 §6.6). Los 4 mutantes del motor (07 §19.4, DP-26; TA-112) corren en
# `prop`, dentro de `pnpm ci:nocturno` (tools/ci/afecta.mjs).
# CH-266 (CI corta): `suites`, `e2e-fragmento`, `e2e` y `cierre` salieron de ci.yml: fallar avisa (correo de workflow
# fallido), pero no bloquea merges ni despliegues. Se lanzan a mano con workflow_dispatch.
name: nocturno

on:
  schedule:
    - cron: '15 8 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: nocturno
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  minutos:
    name: minutos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Solo este job lee la API de ejecuciones (6.5: sin token personal)
    permissions:
      contents: read
      actions: read
    outputs:
      correr: ${{ steps.minutos.outputs.correr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      # El estado anterior: lleva la última corrida de las suites y FINN_REN_ROJO de un mes al otro
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/ci-modo
          key: ci-modo-${{ github.run_id }}
          restore-keys: ci-modo-
      - id: minutos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/minutos.ts calcular
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/ci-modo
          key: ci-modo-${{ steps.minutos.outputs.mes }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minutos-${{ steps.minutos.outputs.mes }}
          path: test-results/minutos/
          retention-days: 90

  prop:
    name: prop
    needs: minutos
    if: needs.minutos.outputs.correr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FC_RUNS: '10000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:nocturno

  # Presupuestos de tiempo del motor a 10 años de volumen alto (07 §6.6, P7-5; BE-23; TA-156): carga ≤ 500 ms
  # (PRU-REN-MOTOR-001), `calcular` ≤ 150 ms (PRU-REN-MOTOR-101) y el costo de las verificaciones diferidas
  # (PRU-REN-ESQ-001, sin tope). Mediana de 5 en el runner. Superar un tiempo no falla el job: abre un aviso y fija
  # FINN_REN_ROJO (ren_rojo_desde en el estado de `minutos`); con más de 7 días activo, `rapido` falla.
  ren:
    name: ren
    needs: minutos
    if: needs.minutos.outputs.correr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FINN_NOCTURNO: ren
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      # TA-222: el Chromium de LCP, CLS e INP (05 §13.4, apps/web/e2e/rendimiento/tiempos.e2e.ts)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # El estado que dejó `minutos` (la caché más reciente): ren_rojo_desde viaja de una noche a la siguiente
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/ci-modo
          key: ci-modo-ren-${{ github.run_id }}
          restore-keys: ci-modo-
      - run: pnpm ci:nocturno
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: test-results/ci-modo
          key: ci-modo-ren-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ren-${{ github.run_id }}
          path: test-results/ren/
          retention-days: 90

  # Respaldo y restauración (07 §19.6, nivel RES; 03 §12; TA-251): el volumen base a 10 años se vuelca con
  # respaldar.mjs, se cifra con age (una clave X25519 generada en la prueba, nunca la real) y restaurar.sh lo
  # restaura en un PostgreSQL vacío sin `auth`; el control, un volcado con una FK hacia auth.users, debe fallar.
  # Los clientes de PostgreSQL son los del contenedor (misma versión mayor, 04 §16.2): nada que instalar en el runner.
  respaldo:
    name: respaldo
    needs: minutos
    if: needs.minutos.outputs.correr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FINN_NOCTURNO: respaldo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:nocturno

  # CH-266: lo que salió de `rapido` y de los PR: `unidad`, `escenarios-motor`, `contratos` y `componentes` (en
  # Chromium) y la integración entera, con sus informes JSON para M15 (rapido.json e integracion.json, en
  # `informes-suites`).
  suites:
    name: suites
    needs: minutos
    if: needs.minutos.outputs.correr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FINN_NOCTURNO: suites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:nocturno
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-suites
          path: test-results/informes/
          if-no-files-found: ignore
          retention-days: 3

  # CH-266 (antes en ci.yml, CH-231): la E2E completa de `movil` en 4 fragmentos (`--shard i/4`), cada uno con su pila,
  # su usuario de prueba y su siembra en su runner; el job `e2e` une los informes.
  e2e-fragmento:
    name: e2e-fragmento-${{ matrix.fragmento }}
    needs: minutos
    if: needs.minutos.outputs.correr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fragmento: [1, 2, 3, 4]
    env:
      FINN_E2E_GREP: todas
      FINN_E2E_FRAGMENTO: ${{ matrix.fragmento }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # TA-222 (05 §13.4): la última medida guardada, para comparar en el resumen del job
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/tamanos-main
          key: tamanos-main-${{ github.run_id }}
          restore-keys: tamanos-main-
      - run: pnpm ci:e2e
      # El blob para el job `e2e`; las trazas solo existen si una prueba falló (07 §6.4: 3 días)
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.fragmento }}
          path: test-results/e2e-blob/
          if-no-files-found: ignore
          retention-days: 3
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-trazas-${{ matrix.fragmento }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # Une los blobs en apps/web/test-results/informe.json (`informes-e2e`, para `cierre`), avisa las inestables y pasa
  # solo si pasaron los 4 fragmentos.
  e2e:
    name: e2e
    needs: [minutos, e2e-fragmento]
    if: ${{ !cancelled() && needs.minutos.outputs.correr == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 07 §7.3: issues: write solo aquí, para el issue `prueba-inestable` de cada prueba flaky
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: e2e-blob-*, merge-multiple: true, path: test-results/e2e-blob }
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          FINN_E2E_FRAGMENTOS: ${{ needs.e2e-fragmento.result }}
          FINN_E2E_GREP: todas
        run: pnpm ci:e2e-unir
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-e2e
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # M15 (07 §13.3) con los informes de `suites` y `e2e` de esta corrida, y M1 a M14 sobre el inventario. Corre aunque
  # alguno haya fallado: la matriz dice qué ficha terminada quedó sin verde.
  cierre:
    name: cierre
    needs: [minutos, suites, e2e]
    if: ${{ !cancelled() && needs.minutos.outputs.correr == 'true' }}
    runs-on: ubuntu-24.04
    # CH-206: `playwright install --with-deps` depende del espejo de Ubuntu (3 s a más de 9 min)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      # pruebas:listar recolecta el proyecto `componentes` en Chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: informes-*, merge-multiple: true, path: test-results/informes }
      - run: pnpm ci:cierre
