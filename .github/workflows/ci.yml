# CI de Finn (TA-012; 07 §6.1, §6.2, §32.2; DP-10, DP-33, DP-34; CH-16). Cada job llama solo a sus `pnpm ci:<job>`;
# las decisiones (M1 a M3 y cierre) viven en tools/ci/afecta.mjs y tools/ci/workflows.test.ts comprueba este archivo.
# `rapido` corre `integracion` dentro (M5) y la publica como estado de commit aparte. `desplegar` (TA-260) solo corre en `main`.
# M4 (TA-013; 07 §6.5): `rapido` restaura el modo que dejó el nocturno; tools/ci/minutos.ts y afecta.mjs lo aplican.
name: ci

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]

# En PR, un push nuevo cancela la corrida anterior; en main no, y GitHub coalesce las pendientes (M3).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  FINN_EVENTO: ${{ github.event_name }}
  FINN_BORRADOR: ${{ github.event.pull_request.draft }}
  FINN_ACCION: ${{ github.event.action }}
  FINN_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
  FC_RUNS: ${{ github.event_name == 'push' && '2000' || '300' }}

jobs:
  rapido:
    name: rapido
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # CH-16: statuses: write solo aquí, para el estado de commit `integracion`
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      afecta_db: ${{ steps.rapido.outputs.afecta_db }}
      afecta_web: ${{ steps.rapido.outputs.afecta_web }}
      integracion: ${{ steps.rapido.outputs.integracion }}
      e2e: ${{ steps.rapido.outputs.e2e }}
      cierre: ${{ steps.rapido.outputs.cierre }}
      grep_e2e: ${{ steps.rapido.outputs.grep_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: gitleaks (fijado por versión y suma)
        id: gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archivo"
          echo "${GITLEAKS_SHA256}  $archivo" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # La entrada más reciente (la de main se ve desde los PR); minutos.ts usa solo la del mes en curso
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/ci-modo
          key: ci-modo-${{ github.run_id }}
          restore-keys: ci-modo-
      - id: rapido
        run: pnpm ci:rapido
      # CH-22: la imagen de PostgreSQL de integracion, por digest (infra/versiones.env), desde la caché, ECR
      # con 3 intentos o el espejo de Google; se etiqueta como la pide el arnés para que testcontainers no la baje.
      - id: pg-version
        if: steps.rapido.outputs.integracion == 'true'
        run: grep -E '^(PG_MAYOR|PG_IMAGEN_DIGEST|PGBOUNCER_IMAGEN_DIGEST)=' infra/versiones.env >> "$GITHUB_OUTPUT"
      - if: steps.rapido.outputs.integracion == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/finn-pg
          key: pg-${{ steps.pg-version.outputs.PG_MAYOR }}-${{ steps.pg-version.outputs.PG_IMAGEN_DIGEST }}
      - id: pg-imagen
        if: steps.rapido.outputs.integracion == 'true'
        env:
          PG_MAYOR: ${{ steps.pg-version.outputs.PG_MAYOR }}
          PG_IMAGEN_DIGEST: ${{ steps.pg-version.outputs.PG_IMAGEN_DIGEST }}
        run: |
          set -euo pipefail
          ecr="public.ecr.aws/docker/library/postgres"
          tar="$HOME/.cache/finn-pg/postgres.tar"
          if [ -f "$tar" ]; then
            docker load -i "$tar"
            exit 0
          fi
          origen=""
          for i in 1 2 3; do
            if docker pull "${ecr}@${PG_IMAGEN_DIGEST}"; then origen="$ecr"; break; fi
            sleep $((i * 15))
          done
          if [ -z "$origen" ]; then
            origen="mirror.gcr.io/library/postgres"
            docker pull "${origen}@${PG_IMAGEN_DIGEST}"
          fi
          docker tag "${origen}@${PG_IMAGEN_DIGEST}" "${ecr}:${PG_MAYOR}"
          mkdir -p "$(dirname "$tar")"
          docker save -o "$tar" "${ecr}:${PG_MAYOR}"
      # TA-059: la imagen de PgBouncer de PRU-INT-POOL, por digest; la baja packages/db/test/ayudantes/pgbouncer.ts
      # (espejo de Google con 3 intentos y Docker Hub) y la deja aquí; esta caché la guarda al terminar el job.
      - if: steps.rapido.outputs.integracion == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/finn-pgbouncer
          key: pgbouncer-${{ steps.pg-version.outputs.PGBOUNCER_IMAGEN_DIGEST }}
      - if: steps.rapido.outputs.integracion == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm ci:integracion
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-rapido
          path: test-results/informes/
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: e2e
    needs: rapido
    if: needs.rapido.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 07 §7.3: issues: write solo aquí, para el issue `prueba-inestable` de cada prueba flaky
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    env:
      FINN_E2E_GREP: ${{ needs.rapido.outputs.grep_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # TA-222 (05 §13.4): la última medida de `main`, para comparar en el resumen del job
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/tamanos-main
          key: tamanos-main-${{ github.run_id }}
          restore-keys: tamanos-main-
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm ci:e2e
      - if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/tamanos-main
          key: tamanos-main-${{ github.run_id }}
      # El informe JSON para cierre; las trazas solo existen si una prueba falló (07 §6.4: 3 días)
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-e2e
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  cierre:
    name: cierre
    needs: [rapido, e2e]
    if: ${{ !cancelled() && needs.rapido.result == 'success' && needs.rapido.outputs.cierre == 'true' && needs.e2e.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      # pruebas:listar recolecta el proyecto `componentes` en Chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: informes-*, merge-multiple: true, path: test-results/informes }
      - run: pnpm ci:cierre

  # TA-260 (02 ADR-10, 03 §11.7, 07 §6.1, CH-64). `integracion` corre dentro de `rapido` (M5, DP-33): el `if` exige
  # que haya corrido, y sin función de estado el `if` exige además que todos los `needs` terminen en `success`.
  # contents: write solo aquí, para la etiqueta del commit desplegado (04 §16.3, paso 5). Los secretos llegan solo al
  # paso que los usa; ningún guardia saltea el despliegue si faltan: el job falla.
  desplegar:
    name: desplegar
    needs: [rapido, e2e, cierre]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.rapido.outputs.integracion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:politica-patrones
      - env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RESPALDO_DB_URL: ${{ secrets.RESPALDO_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm ci:desplegar
