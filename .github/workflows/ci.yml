# CI de Finn (TA-012; 07 §6.1, §6.2, §32.2; DP-10, DP-33, DP-34; CH-16). Cada job llama solo a sus `pnpm ci:<job>`;
# las decisiones (M1 a M3 y cierre) viven en tools/ci/afecta.mjs y tools/ci/workflows.test.ts comprueba este archivo.
# `rapido` corre `integracion` dentro (M5) y la publica como estado de commit aparte. `desplegar` (TA-260) solo corre en `main`.
# M4 (TA-013; 07 §6.5): `rapido` restaura el modo que dejó el nocturno; tools/ci/minutos.ts y afecta.mjs lo aplican.
name: ci

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]

# En PR, un push nuevo cancela la corrida anterior; en main no, y GitHub coalesce las pendientes (M3).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  FINN_EVENTO: ${{ github.event_name }}
  FINN_BORRADOR: ${{ github.event.pull_request.draft }}
  FINN_ACCION: ${{ github.event.action }}
  FINN_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
  FC_RUNS: ${{ github.event_name == 'push' && '2000' || '300' }}

jobs:
  rapido:
    name: rapido
    runs-on: ubuntu-24.04
    # CH-206: margen para el espejo de Ubuntu en `navegadores` (apt de Playwright); 25 cortó #423.
    timeout-minutes: 35
    # CH-16: statuses: write solo aquí, para el estado de commit `integracion`
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      afecta_db: ${{ steps.rapido.outputs.afecta_db }}
      afecta_web: ${{ steps.rapido.outputs.afecta_web }}
      integracion: ${{ steps.rapido.outputs.integracion }}
      e2e: ${{ steps.rapido.outputs.e2e }}
      cierre: ${{ steps.rapido.outputs.cierre }}
      grep_e2e: ${{ steps.rapido.outputs.grep_e2e }}
      reutiliza_e2e: ${{ steps.rapido.outputs.reutiliza_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: gitleaks (fijado por versión y suma)
        id: gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archivo"
          echo "${GITLEAKS_SHA256}  $archivo" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # La entrada más reciente (la de main se ve desde los PR); minutos.ts usa solo la del mes en curso
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/ci-modo
          key: ci-modo-${{ github.run_id }}
          restore-keys: ci-modo-
      # CH-231 c (TA-555): en main, si el commit es el squash de un PR con su mismo árbol que contiene el main anterior
      # y cuya CI pasó entera con la E2E completa, `ci:rapido` publica e2e=false y reutiliza_e2e=<run_id de esa corrida>.
      # Ante cualquier duda no deja nada y main corre todo. El token llega solo a este paso.
      - if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm ci:reutiliza-e2e
      - id: rapido
        run: pnpm ci:rapido
      # CH-22: la imagen de PostgreSQL de integracion, por digest (infra/versiones.env), desde la caché, ECR
      # con 3 intentos o el espejo de Google; se etiqueta como la pide el arnés para que testcontainers no la baje.
      - id: pg-version
        if: steps.rapido.outputs.integracion == 'true'
        run: grep -E '^(PG_MAYOR|PG_IMAGEN_DIGEST|PGBOUNCER_IMAGEN_DIGEST)=' infra/versiones.env >> "$GITHUB_OUTPUT"
      - if: steps.rapido.outputs.integracion == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/finn-pg
          key: pg-${{ steps.pg-version.outputs.PG_MAYOR }}-${{ steps.pg-version.outputs.PG_IMAGEN_DIGEST }}
      - id: pg-imagen
        if: steps.rapido.outputs.integracion == 'true'
        env:
          PG_MAYOR: ${{ steps.pg-version.outputs.PG_MAYOR }}
          PG_IMAGEN_DIGEST: ${{ steps.pg-version.outputs.PG_IMAGEN_DIGEST }}
        run: |
          set -euo pipefail
          ecr="public.ecr.aws/docker/library/postgres"
          tar="$HOME/.cache/finn-pg/postgres.tar"
          if [ -f "$tar" ]; then
            docker load -i "$tar"
            exit 0
          fi
          origen=""
          for i in 1 2 3; do
            if docker pull "${ecr}@${PG_IMAGEN_DIGEST}"; then origen="$ecr"; break; fi
            sleep $((i * 15))
          done
          if [ -z "$origen" ]; then
            origen="mirror.gcr.io/library/postgres"
            docker pull "${origen}@${PG_IMAGEN_DIGEST}"
          fi
          docker tag "${origen}@${PG_IMAGEN_DIGEST}" "${ecr}:${PG_MAYOR}"
          mkdir -p "$(dirname "$tar")"
          docker save -o "$tar" "${ecr}:${PG_MAYOR}"
      # TA-059: la imagen de PgBouncer de PRU-INT-POOL, por digest; la baja packages/db/test/ayudantes/pgbouncer.ts
      # (espejo de Google con 3 intentos y Docker Hub) y la deja aquí; esta caché la guarda al terminar el job.
      - if: steps.rapido.outputs.integracion == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/finn-pgbouncer
          key: pgbouncer-${{ steps.pg-version.outputs.PGBOUNCER_IMAGEN_DIGEST }}
      - if: steps.rapido.outputs.integracion == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm ci:integracion
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-rapido
          path: test-results/informes/
          if-no-files-found: ignore
          retention-days: 3

  # CH-231: la E2E corre en 4 fragmentos (`--shard i/4`), cada uno con su pila, su usuario de prueba y su siembra en su
  # runner; el job `e2e` une los informes y es el check que leen `cierre`, `desplegar` y `pr:mergear`.
  e2e-fragmento:
    name: e2e-fragmento-${{ matrix.fragmento }}
    needs: rapido
    if: needs.rapido.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    # CH-208: en main tarda de 22m29 a 27m40; 30 cortó #446.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fragmento: [1, 2, 3, 4]
    env:
      FINN_E2E_GREP: ${{ needs.rapido.outputs.grep_e2e }}
      FINN_E2E_FRAGMENTO: ${{ matrix.fragmento }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # TA-222 (05 §13.4): la última medida de `main`, para comparar en el resumen del job
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/tamanos-main
          key: tamanos-main-${{ github.run_id }}
          restore-keys: tamanos-main-
      - run: pnpm ci:e2e
      # Solo el fragmento que corrió tamano.e2e.ts tiene la medida
      - if: ${{ github.event_name == 'push' && hashFiles('test-results/tamanos-main/tamanos.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/tamanos-main
          key: tamanos-main-${{ github.run_id }}
      # El blob para el job `e2e`; las trazas solo existen si una prueba falló (07 §6.4: 3 días)
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.fragmento }}
          path: test-results/e2e-blob/
          if-no-files-found: ignore
          retention-days: 3
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-trazas-${{ matrix.fragmento }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # CH-231: pasa solo si pasaron los 4 fragmentos; une sus blobs en el informe JSON de siempre (`informes-e2e`, con
  # apps/web/test-results/informe.json) para `cierre` y avisa las inestables.
  e2e:
    name: e2e
    needs: [rapido, e2e-fragmento]
    if: ${{ !cancelled() && needs.rapido.outputs.e2e == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 07 §7.3: issues: write solo aquí, para el issue `prueba-inestable` de cada prueba flaky
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: e2e-blob-*, merge-multiple: true, path: test-results/e2e-blob }
      # El filtro queda en e2e-completa.json, dentro de informes-e2e: main reutiliza solo una E2E sin filtro (TA-555)
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          FINN_E2E_FRAGMENTOS: ${{ needs.e2e-fragmento.result }}
          FINN_E2E_GREP: ${{ needs.rapido.outputs.grep_e2e }}
        run: pnpm ci:e2e-unir
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-e2e
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # CH-237: en un PR corre también con la E2E completa en verde, así esa corrida queda entera para que main la reutilice.
  cierre:
    name: cierre
    needs: [rapido, e2e]
    if: ${{ !cancelled() && needs.rapido.result == 'success' && needs.e2e.result != 'failure' && (needs.rapido.outputs.cierre == 'true' || (needs.e2e.result == 'success' && needs.rapido.outputs.grep_e2e == 'todas')) }}
    runs-on: ubuntu-24.04
    # CH-206: `playwright install --with-deps` depende del espejo de Ubuntu (3 s a más de 9 min); 10 cortaba el job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      # pruebas:listar recolecta el proyecto `componentes` en Chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: informes-*, merge-multiple: true, path: test-results/informes }
      # TA-555: con la E2E reutilizada, M15 lee el informe de la corrida del PR con el mismo árbol
      - if: needs.rapido.outputs.reutiliza_e2e != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: informes-e2e
          path: test-results/informes
          run-id: ${{ needs.rapido.outputs.reutiliza_e2e }}
          github-token: ${{ github.token }}
      - run: pnpm ci:cierre

  # TA-260 (02 ADR-10, 03 §11.7, 07 §6.1, CH-64). `integracion` corre dentro de `rapido` (M5, DP-33): el `if` exige
  # que haya corrido, y cada `needs` en `success`; `e2e` saltado solo vale con reutiliza_e2e (TA-555, CH-231 c).
  # contents: write solo aquí, para la etiqueta del commit desplegado (04 §16.3, paso 5). Los secretos llegan solo al
  # paso que los usa; ningún guardia saltea el despliegue si faltan: el job falla.
  desplegar:
    name: desplegar
    needs: [rapido, e2e, cierre]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.rapido.result == 'success' && needs.rapido.outputs.integracion == 'true' && needs.cierre.result == 'success' && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && needs.rapido.outputs.reutiliza_e2e != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:politica-patrones
      - env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RESPALDO_DB_URL: ${{ secrets.RESPALDO_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm ci:desplegar
