; PgBouncer de la suite PRU-INT-POOL (TA-059; 07 §5.3, V7-05; CH-05). Portado de
; docs/anexos/07-pruebas-verificacion/07-pruebas-verificacion/pooler/pgbouncer.ini: hace de Supavisor en modo
; transacción, sin sentencias preparadas y con 2 conexiones de servidor por base y usuario.
; packages/db/test/ayudantes/pgbouncer.ts reemplaza @PG_HOST@ y @PG_PUERTO@ por el contenedor de PostgreSQL
; del arnés y escribe usuarios.txt con la clave de prueba de finn_app. Base comodín: cualquier base del
; contenedor, también la de prueba de cada archivo (07 §5.2, paso 5).
[databases]
* = host=@PG_HOST@ port=@PG_PUERTO@

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/usuarios.txt
pool_mode = transaction
max_prepared_statements = 0
default_pool_size = 2
max_client_conn = 50
ignore_startup_parameters = extra_float_digits,options
