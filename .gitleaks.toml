# gitleaks sobre el diff en `rapido` (07 §3, §6.1; SEG-gitleaks). Reglas por defecto de la versión fijada en
# .github/workflows/ci.yml, más dos excepciones: el secreto falso de control, que tools/ci/workflows.test.ts
# escanea aparte con la configuración por defecto para comprobar que gitleaks falla, y el token inventado de la demo
# del diseño (CH-220), acotado a su valor exacto y a su archivo.
[extend]
useDefault = true

[[allowlists]]
description = "Secreto falso de control (TA-012)"
paths = ['''(?:^|/)tools/lint/controles/secreto\.txt$''']

[[allowlists]]
description = "Token de ejemplo inventado de la demo del diseño (CH-220): solo ese valor y solo en ese archivo"
condition = "AND"
paths = ['''^docs/anexos/finn-fixes-visuales/demo/finn-demo\.html$''']
regexes = ['''fn_live_8Q2KJ4M7Q2K''']
