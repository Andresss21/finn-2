/* ===== finn.css: base, animaciones y reducir movimiento ===== */
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes fz-needle{from{left:50%}}
@keyframes fz-pop{from{opacity:0;transform:scaleY(.15)}}
@keyframes fz-blink{50%{opacity:0}}
@keyframes fz-marquee{to{transform:translateX(-50%)}}
@keyframes fz-flip{0%{transform:rotateX(-90deg);opacity:0}60%{transform:rotateX(14deg);opacity:1}100%{transform:rotateX(0);opacity:1}}
@keyframes fz-rise{from{height:0}}
@keyframes fz-sheen{0%{transform:translateX(-160%) skewX(-18deg)}55%,100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes fz-led{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes fz-draw{from{stroke-dashoffset:1400}}
@keyframes fz-stamp{0%{transform:scale(2.2) rotate(-9deg);opacity:0}70%{transform:scale(.94) rotate(-9deg);opacity:1}100%{transform:scale(1) rotate(-9deg);opacity:1}}
@keyframes fz-jitter{0%,100%{transform:none}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes fz-in{from{opacity:0;transform:translateY(12px)}}
@keyframes fz-grow{from{width:0}}
.fz-hold{position:relative;overflow:hidden}
.fz-hold .fz-fill{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .25s ease-out}
.fz-hold:active .fz-fill{width:100%;transition:width 1.4s linear}
.fz-key{transition:transform .08s, box-shadow .08s}
.fz-key:active{transform:translateY(3px);box-shadow:none !important}
.fz-go .fz-arr{transition:transform .2s}
.fz-go:hover .fz-arr{transform:translateX(4px)}
.fz-lift{transition:transform .2s}
.fz-lift:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
@keyframes fz-deal{from{transform:translateY(90px) rotate(-5deg) scale(.92);opacity:0}}
@keyframes fz-bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
@keyframes fz-spin{to{transform:rotate(360deg)}}
@keyframes fz-fade{from{opacity:0}}
@keyframes fz-roll{from{transform:translateY(0)}}
@keyframes fz-fan{from{transform:translate(0,0) scale(.3);opacity:0}}
@keyframes fz-slide{from{transform:translateX(-24px);opacity:0}}
@keyframes fz-under{from{transform:scaleX(0)}}
@keyframes fz-nudge{0%,60%,100%{transform:translateX(0)}30%{transform:translateX(14px)}}
@keyframes fz-float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes fz-up{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fz-ring{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes fz-pop-in{from{transform:scale(.85);opacity:0}}
@keyframes fz-dash{to{stroke-dashoffset:-20}}
@keyframes fz-flow{to{stroke-dashoffset:-24}}
@keyframes fz-drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(26px);opacity:0}}
@keyframes fz-ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes fz-blob{0%,100%{border-radius:42% 58% 55% 45% / 55% 45% 55% 45%}50%{border-radius:58% 42% 45% 55% / 45% 58% 42% 55%}}
@keyframes fz-wave{to{transform:translateX(-50%)}}
@keyframes fz-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fz-travel{from{left:0}to{left:calc(100% - 6px)}}
@keyframes fz-shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes fz-spin2{to{transform:rotate(360deg)}}
@keyframes fz-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes fz-peek{from{transform:translateY(8px);opacity:0}}
@keyframes fz-halo{0%{transform:scale(.94);opacity:.6}100%{transform:scale(1.3);opacity:0}}
@keyframes fz-drift{from{background-position:0 0, 0 0}to{background-position:60px -40px, -50px 30px}}
@keyframes fz-glow{0%,100%{opacity:.55}50%{opacity:.8}}
.fz-shine{position:relative;overflow:hidden}
.fz-shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.fz-shine:hover::after{transform:translateX(130%)}
.fz-row{transition:background-color .2s}
.fz-row:hover{background-color:rgba(127,127,127,.06)}

.fz-scr{position:absolute;inset:0}
[style*="overflow-y: auto"],[style*="overflow-x: auto"]{scrollbar-width:none;-ms-overflow-style:none}

.fz-d-tab,.fz-d-down{animation:fz-s-fade .3s cubic-bezier(.2,0,0,1) both}
.fz-d-right{animation:fz-s-right .32s cubic-bezier(.2,0,0,1) both}
.fz-d-left{animation:fz-s-left .32s cubic-bezier(.2,0,0,1) both}
.fz-d-push{animation:fz-s-push .36s cubic-bezier(.2,0,0,1) both}
.fz-d-back{animation:fz-s-back .36s cubic-bezier(.2,0,0,1) both}
.fz-d-up{animation:fz-s-up .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes fz-s-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fz-s-right{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes fz-s-left{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes fz-s-push{from{opacity:.3;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes fz-s-back{from{opacity:.3;transform:translateX(-50px)}to{opacity:1;transform:none}}
@keyframes fz-s-up{from{transform:translateY(100%)}to{transform:none}}
.fz-sh-in{animation:fz-sh-in .38s cubic-bezier(.2,.9,.25,1) both}
.fz-sh-out{animation:fz-sh-out .2s cubic-bezier(.4,0,1,1) both}
@keyframes fz-sh-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes fz-sh-out{from{transform:none}to{transform:translateY(100%)}}
.fz-dr-in{animation:fz-dr-in .36s cubic-bezier(.2,.9,.25,1) both}
.fz-dr-out{animation:fz-dr-out .2s cubic-bezier(.4,0,1,1) both}
@keyframes fz-dr-in{from{transform:translateY(-100%)}to{transform:none}}
@keyframes fz-dr-out{from{transform:none}to{transform:translateY(-100%)}}
.fz-v-in{animation:fz-v-in .28s ease both}.fz-v-out{animation:fz-v-out .2s ease both}
@keyframes fz-v-in{from{opacity:0}to{opacity:1}}
@keyframes fz-v-out{from{opacity:1}to{opacity:0}}
@keyframes fz-item{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fz-pill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
