/* Roles tipográficos (A.5): en rem; los montos con cifras tabulares */
.t-cifra-principal { font-family: var(--fuente-cuerpo); font-size: 2.75rem; line-height: 1.05; font-weight: 800; font-stretch: 72%; font-variant-numeric: tabular-nums; }
.t-cifra { font-family: var(--fuente-cuerpo); font-size: 1.25rem; line-height: 1.25; font-weight: 700; font-stretch: 80%; font-variant-numeric: tabular-nums; }
.t-titulo-pantalla { font-family: var(--fuente-titulo); font-size: 2rem; line-height: 1.05; font-weight: 800; letter-spacing: .01em; text-transform: uppercase; }
.t-titulo-seccion { font-family: var(--fuente-titulo); font-size: 1.375rem; line-height: 1.15; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
.t-cuerpo { font-family: var(--fuente-cuerpo); font-size: 1rem; line-height: 1.5; font-weight: 400; }
.t-cuerpo-pequeno { font-family: var(--fuente-cuerpo); font-size: .875rem; line-height: 1.45; font-weight: 400; }
.t-etiqueta { font-family: var(--fuente-cuerpo); font-size: .875rem; line-height: 1.35; font-weight: 500; }
.t-rotulo { font-family: var(--fuente-cuerpo); font-size: .75rem; line-height: 1.3; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

body{margin:0}

<script>
/* FinnRuntime — reemplazo mínimo del runtime del canvas para abrir el prototipo sin él.
   Soporta lo que usa la plantilla del prototipo:
   - <sc-if value="{{ruta}}"> … </sc-if>  → monta o desmonta su contenido (al montar, las animaciones CSS corren igual que en el canvas);
   - onClick="{{manejador}}"               → escucha el evento y llama a la función devuelta por renderVals();
   - atributos con {{ruta}} intercalado     → por ejemplo class="fz-scr fz-d-{{dir}}", se actualizan en su lugar.
   La clase Component extiende DCLogic: this.state, this.setState(parcial), renderVals(). Lo que no cambia queda montado,
   como en el canvas (React), así que las animaciones de entrada solo corren cuando algo aparece. */
class DCLogic {
  constructor() { this.props = {}; this.state = undefined; }
  setState(parcial) {
    const prev = this.state || {};
    const next = typeof parcial === 'function' ? parcial(prev) : parcial;
    this.state = Object.assign({}, prev, next);
    if (this.__programar) this.__programar();
  }
  forceUpdate() { if (this.__programar) this.__programar(); }
}

const FinnRuntime = (() => {
  const HUECO = /\{\{\s*([\w.$]+)\s*\}\}/g;
  const UNO = /\{\{\s*([\w.$]+)\s*\}\}/;
  let vals = {};
  const leer = (ruta) => {
    if (ruta === 'true') return true;
    if (ruta === 'false') return false;
    return ruta.split('.').reduce((o, k) => (o == null ? o : o[k]), vals);
  };

  function compilar(nodo, enlaces) {
    for (const el of [...nodo.childNodes]) {
      if (el.nodeType !== 1) continue;
      if (el.tagName === 'SC-IF') {
        const m = UNO.exec(el.getAttribute('value') || '');
        const ancla = document.createComment('sc-if ' + (m ? m[1] : ''));
        const molde = document.createDocumentFragment();
        while (el.firstChild) molde.appendChild(el.firstChild);
        el.replaceWith(ancla);
        enlaces.push({ tipo: 'si', ancla, molde, ruta: m ? m[1] : 'false', montado: null });
        continue;
      }
      for (const a of [...el.attributes]) {
        if (!a.value.includes('{{')) continue;
        if (a.name.startsWith('on')) {
          const m = UNO.exec(a.value);
          const evento = a.name.slice(2);
          el.removeAttribute(a.name);
          el.addEventListener(evento, (e) => { const f = leer(m[1]); if (typeof f === 'function') f(e); });
        } else {
          enlaces.push({ tipo: 'attr', el, nombre: a.name, molde: a.value });
        }
      }
      compilar(el, enlaces);
    }
  }

  function actualizar(enlaces) {
    for (const e of enlaces) {
      if (e.tipo === 'attr') {
        const v = e.molde.replace(HUECO, (_, r) => { const x = leer(r); return x == null ? '' : String(x); });
        if (e.el.getAttribute(e.nombre) !== v) e.el.setAttribute(e.nombre, v);
        continue;
      }
      const on = !!leer(e.ruta);
      if (on && !e.montado) {
        const frag = e.molde.cloneNode(true);
        const hijos = [];
        compilar(frag, hijos);
        actualizar(hijos);
        const nodos = [...frag.childNodes];
        e.ancla.parentNode.insertBefore(frag, e.ancla.nextSibling);
        e.montado = { nodos, hijos };
      } else if (on && e.montado) {
        actualizar(e.montado.hijos);
      } else if (!on && e.montado) {
        desmontar(e);
      }
    }
  }

  // Quita primero los bloques internos montados después (quedan como hermanos de su ancla) y luego los nodos propios.
  function desmontar(e) {
    for (const h of e.montado.hijos) if (h.tipo === 'si' && h.montado) desmontar(h);
    e.montado.nodos.forEach((n) => n.remove());
    e.montado = null;
  }

  function montar(Clase, opciones) {
    const plantilla = document.getElementById((opciones && opciones.plantilla) || 'finn-tpl');
    const raiz = document.getElementById((opciones && opciones.raiz) || 'finn-root');
    const comp = new Clase();
    const frag = plantilla.content.cloneNode(true);
    const enlaces = [];
    compilar(frag, enlaces);
    let pendiente = false;
    const render = () => { vals = comp.renderVals() || {}; actualizar(enlaces); };
    comp.__programar = () => { if (pendiente) return; pendiente = true; queueMicrotask(() => { pendiente = false; render(); }); };
    vals = comp.renderVals() || {};
    actualizar(enlaces);
    raiz.appendChild(frag);
    if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
    window.FinnApp = comp; // para depurar: FinnApp.state
    return comp;
  }
  return { montar };
})();

</script>
<script>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const screen = st.screen || 'inicio';
    const stop = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    const TABS = { inicio: 0, presupuesto: 1, bandeja: 2, actividad: 3, cuentas: 4 };
    const dirFor = (from, to) => {
      if (from === to) return 'none';
      if (to === 'registrar') return 'up';
      if (from === 'registrar') return 'down';
      if (to === 'detalle' || to === 'semanal') return 'push';
      if (from === 'detalle' || from === 'semanal') return 'back';
      if (TABS[from] !== undefined && TABS[to] !== undefined) return TABS[to] > TABS[from] ? 'right' : 'left';
      return 'tab';
    };
    const go = (sc, extra) => (e) => {
      stop(e); clearTimeout(this._t);
      this.setState(Object.assign({ screen: sc, prev: screen === 'registrar' ? (st.prev || 'inicio') : screen, sheet: null, closing: false, dir: dirFor(screen, sc) }, extra || {}));
    };
    const sheet = (name) => (e) => { stop(e); clearTimeout(this._t); this.setState({ sheet: name, closing: false }); };
    const close = (e) => {
      stop(e);
      if (!st.sheet || st.closing) return;
      this.setState({ closing: true });
      clearTimeout(this._t);
      this._t = setTimeout(() => this.setState({ sheet: null, closing: false }), 200);
    };
    const set = (patch) => (e) => { stop(e); this.setState(Object.assign({ dir: 'none' }, patch)); };
    const front = st.front || 'visa';
    return {
      dir: st.dir || 'tab',
      sheetPhase: st.closing ? 'out' : 'in',
      s: { inicio: screen === 'inicio', presupuesto: screen === 'presupuesto', detalle: screen === 'detalle', bandeja: screen === 'bandeja',
           registrar: screen === 'registrar', cuentas: screen === 'cuentas', actividad: screen === 'actividad', semanal: screen === 'semanal' },
      filtroSobre: !!st.filtro, filtroTodas: !st.filtro, approved: !!st.approved, notApproved: !st.approved, saved: !!st.saved, notSaved: !st.saved,
      sheetAsignar: st.sheet === 'asignar', sheetMas: st.sheet === 'mas', sheetNotif: st.sheet === 'notif',
      notifUnread: !st.read, notifRead: !!st.read,
      frontIsVisa: front === 'visa', frontIsMc: front === 'mc',
      semOn: !!st.semTabla, semOff: !st.semTabla, histOn: !!st.histTabla, histOff: !st.histTabla,
      goInicio: go('inicio'), goPresupuesto: go('presupuesto', { filtro: false }), goPresupuestoFiltro: go('presupuesto', { filtro: true }), goDetalle: go('detalle'),
      goBandeja: go('bandeja'), goActividad: go('actividad'), goCuentas: go('cuentas'), goCuentasVisa: go('cuentas', { front: 'visa' }), goSemanal: go('semanal'),
      goRegistrar: go('registrar', { saved: false }),
      openAsignar: sheet('asignar'), openMas: sheet('mas'), openNotif: sheet('notif'), closeSheet: close,
      markRead: (e) => { stop(e); this.setState({ read: true }); },
      setTodas: set({ filtro: false }), setSobre: set({ filtro: true }),
      approve: set({ approved: true }), save: set({ saved: true }), newRegistro: set({ saved: false }),
      frontVisa: set({ front: 'visa' }), frontMc: set({ front: 'mc' }),
      semChart: set({ semTabla: false }), semTable: set({ semTabla: true }), histChart: set({ histTabla: false }), histTable: set({ histTabla: true }),
      closeRegistrar: (e) => { stop(e); this.setState({ screen: st.prev || 'inicio', sheet: null, saved: false, dir: 'down' }); },
      resetAll: (e) => { stop(e); clearTimeout(this._t); this.setState({ screen: 'inicio', prev: 'inicio', sheet: null, closing: false, filtro: false, approved: false, saved: false,
                                               read: false, front: 'visa', semTabla: false, histTabla: false, dir: 'tab' }); },
    };
  }
}
</script>
