  const head = [v2Period(), v2LpaStrip(C.lpa), `<div style="display:flex;justify-content:flex-end;margin-top:-12px">${link('Ver cómo se compone', 'go', ['lpa'], 'arrowR')}</div>`, tot, tools];
  const list_ = [chips(FILTROS, f, 'filtro', 'Filtrar categorías'), ...(grupos.length ? grupos : [empty('filter', 'Nada con este filtro', 'Probá con otro filtro.')]),
    arch.length ? v2Section('Archivadas con dinero', '', v2Box(arch.map((k, i) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px">${X(esc(k.nombre), 'cuerpo', V('texto'), 'font-weight:600')}<span style="display:flex;align-items:center;gap:8px">${AMT(C.cats[k.id].disponible, 'cifra', V('positivo-texto'))}${btn('Sacar', 's', 'sheet', ['sacar', k.id], { sm: true })}</span></div>`).join(''))) : '',
    `<div style="display:flex;justify-content:center">${link('Editar grupos y categorías', 'go', ['estructura'], 'edit')}</div>`];
  return { title: 'Presupuesto', body: [...head, ...list_].join(''), dbody: `<div class="dcols" style="grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:36px"><div>${head.join('')}</div><div>${list_.join('')}</div></div>` };
};

/* -------------------------- Detalle de categoría -------------------------- */
SCR.categoria = ([id]) => {
  const k = C.cats[id]; if (!k) return SCR.falta(['?']);
  const txs = S.transacciones.filter(t => t.lineas.some(l => l.cat === id)).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const st = k.estado[0], disp = k.disponible;
  const dcol = Math.abs(disp) < 0.005 ? V('texto') : disp > 0 ? V('positivo-texto') : V((st === 'deuda-sin-respaldo' ? st : 'problema') + '-texto');
  if (k.pagoDe) return payCat(k, id);
  const hero = `<div style="display:flex;flex-direction:column;gap:8px">${X('Disponible', 'rotulo', V('texto-secundario'))}${AMT(disp, 'cifra-principal', dcol, false, 'font-size:3.25rem')}<div>${ind(st, k.estado[1])}</div></div>`;
  const expl = disp < -0.004 ? aviso(st, k.sinCubrir > 0 ? `Gastaste ${fmt(k.sinCubrir)} con tarjeta sin dinero asignado: esa parte queda como deuda sin reservar en la tarjeta hasta que la cubras.` : `Gastaste ${fmt(-disp)} más de lo asignado con débito o efectivo. Si no lo cubrís, al cierre se descuenta de Listo para asignar.`, st === 'deuda-sin-respaldo' ? 'Deuda sin reservar' : 'Sobregirada', [['Cubrir con Mover dinero', 'sheet', ['mover', id]]]) : '';
  const acts = `<div class="acts2">${btn('Asignar', 'p', 'sheet', ['asignar', id], { full: true })}${btn('Mover dinero', 's', 'sheet', ['mover', id], { full: true, ic: 'swap' })}</div>`;
  const per = `<div style="background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1);padding:16px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between">${X('Este período', 'rotulo', V('texto-secundario'))}${X('quedan 5 días', 'cuerpo-pequeno', V('texto-secundario'))}</div>
    ${k.pagoDe ? v2Gauge(C.cuentas[k.pagoDe]?.deuda || 1, Math.max(0, disp), null, null) : v2Gauge(k.asignado + k.arrastre, k.gastado, st, null)}
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${k.pagoDe ? v2Kv('Deuda', fmt(C.cuentas[k.pagoDe]?.deuda || 0)) + v2Kv('Cubierto', fmt(k.cubierto)) + v2Kv('Pagado', fmt(k.pagos)) : v2Kv('Asignado', fmt(k.asignado)) + v2Kv(k.arrastre ? 'Arrastre' : 'Gastado', fmt(k.arrastre ? k.arrastre : k.gastado)) + v2Kv(k.arrastre ? 'Gastado' : 'Disponible', fmt(k.arrastre ? k.gastado : disp))}</div></div>`;
  const meta = k.meta ? v2Section('Meta', link('Editar', 'sheet', ['meta', id]), `<div style="background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1);padding:16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${X((k.meta.tipo === 'fecha' ? 'Para el ' + fdate(k.meta.fecha) : 'Mensual') + ' · ' + fmt(k.meta.monto), 'cuerpo', V('texto'), 'font-weight:700')}${k.falta > 0 ? ind('advertencia', 'Falta ' + fmt(k.falta), true) : ind('positivo', 'Cubierta', true)}</div>${v2Progress(Math.min(100, k.asignado / (k.meta.tipo === 'fecha' ? 245.38 : k.meta.monto) * 100), k.falta > 0 ? 'advertencia' : 'positivo', 'Asignado ' + fmt(k.asignado) + ' de lo que pide este período')}</div>`) : '';
  const movs = v2Section('Consumos del período', '', txs.length ? v2Box(txs.map((t, i) => { const l = t.lineas.find(x => x.cat === id); const tj = C.cuentas[t.cuenta]?.tipo === 'tarjeta'; return v2PlainRow(v2Datebadge(t.fecha), esc(t.comercio), `${cuName(t.cuenta)} · ${tj ? 'con tarjeta' : 'con débito'}${t.lineas.length > 1 ? ' · 1 de ' + t.lineas.length + ' partes' : ''}`, AMT(-l.monto, 'cifra'), 'go', ['transaccion', t.id], i === txs.length - 1); }).join(''))
    : `<div style="padding:16px;background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1)">${X('Todavía no gastaste en esta categoría este período.', 'cuerpo-pequeno', V('texto-secundario'))}</div>`);
  const base = k.asignado || 0, g = k.gastado, sinHist = !base && !g;
  const hist = sinHist ? [] : [['may', base, base * .88], ['jun', base, base * 1.04], ['jul', base, base * .96], ['ago', base, base * 1.21], ['sep', base, base * .99], ['oct', k.asignado, g]];
  const tabla = F('vista_' + id, 'a') === 'b';
  const histS = sinHist ? v2Section('Últimos 6 períodos', '', `<div style="padding:16px;background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1)">${X('Todavía no hay historial: aparece cuando asignes o gastes en esta categoría.', 'cuerpo-pequeno', V('texto-secundario'))}</div>`) : v2Section('Últimos 6 períodos', v2Toggle('Gráfico', 'Tabla', !tabla, 'histVista'), `<div style="background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1);padding:16px">${tabla
    ? `<table class="tb"><thead><tr><th>Período</th><th class="r">Asignado</th><th class="r">Gastado</th><th class="r">Disponible</th></tr></thead><tbody>${hist.map(([m, a, gg]) => `<tr><td>${m}</td><td class="r">${fmt(a)}</td><td class="r">${fmt(gg)}</td><td class="r" style="${a - gg < 0 ? 'color:var(--problema-texto);font-weight:700' : ''}">${a - gg < -0.004 ? gl('problema', 14) + ' ' : ''}${fmt(a - gg)}</td></tr>`).join('')}</tbody></table>`
    : v2HistChart(hist)}</div>`);
  ACT.histVista = (v) => { UI.F['vista_' + id] = v; render(); };
  ACT.catMenu = () => openMenu(esc(k.nombre), [['edit', 'Editar nombre y grupo', 'sheet', ['catEditar', id]], ['target', k.meta ? 'Editar meta' : 'Agregar meta', 'sheet', ['meta', id], k.meta ? `${k.meta.tipo === 'fecha' ? 'Para una fecha' : 'Mensual'} · ${fmt(k.meta.monto)}` : 'Mensual, semanal, anual o para una fecha'],
    ['swap', 'Mover dinero', 'sheet', ['mover', id]], ['lock', 'Archivar', k.pagoDe ? null : 'sheet', ['archivarCat', id], k.pagoDe ? 'Las categorías de pago de tarjeta no se archivan.' : 'Elegís a dónde va el Disponible.'],
    ['reconcile', 'Fusionar con otra categoría', k.pagoDe ? null : 'sheet', ['fusionar', id], k.pagoDe ? 'Es del sistema.' : null], ['trash', 'Eliminar', txs.length || k.pagoDe ? null : 'eliminarCat', id, txs.length ? 'Tiene historial. Podés archivarla o fusionarla.' : null, 'peligro']]);
  const left = [hero, expl, acts, per], right = [meta, movs, histS];
  return { title: esc(k.nombre), child: true, back: 'Presupuesto', right: bell() + moreBtn('catMenu'), dright: bell() + moreBtnD('catMenu'), body: [...left, ...right].filter(Boolean).join(''),
    dbody: `<div class="dcols" style="grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:36px"><div style="gap:20px">${left.join('')}</div><div>${right.join('')}</div></div>` };
};

/* --------------------------------- Bandeja -------------------------------- */
SCR.bandeja = () => {
  const vista = F('bvista', 'pend');
  const pend = C.pendientes, desc = S.bandeja.filter(b => b.estado === 'descartado');
  const listos = pend.filter(b => b.clase === 'listo');
  const tabs = seg([['pend', `Por revisar${pend.length ? ' · ' + pend.length : ''}`], ['desc', 'Descartados']], vista, 'bvista');
  let body;
  if (vista === 'desc') body = desc.length ? v2Box(desc.map((b, i) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;${i === desc.length - 1 ? '' : 'border-bottom:1px solid var(--borde-sutil)'}"><div style="display:flex;flex-direction:column;gap:1px">${X(esc(b.comercio || 'SMS de ' + b.banco), 'cuerpo', V('texto-secundario'), 'font-weight:600')}${X('Descartado hoy', 'cuerpo-pequeno', V('texto-terciario'))}</div><span style="display:flex;align-items:center;gap:4px">${b.monto ? AMT(-b.monto, 'cuerpo', V('texto-secundario')) : ''}${link('Restaurar', 'restaurar', b.id, 'undo')}</span></div>`).join(''))
    : empty('inbox', 'No hay movimientos descartados', 'Lo que descartes queda aquí por si querés restaurarlo.');
  else if (!S.ajustes.webhook.token) body = empty('sms', 'Todavía no hay SMS conectados', 'Conectá los SMS de tu banco y cada compra va a llegar aquí para que la apruebes con un toque.', btn('Conectar los SMS', 'p', 'go', ['webhook']));
  else if (!pend.length) body = `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 16px;text-align:center"><span style="width:72px;height:72px;border-radius:999px;background:var(--positivo-fondo);color:var(--positivo-texto);display:flex;align-items:center;justify-content:center;animation:fz-pop-in .4s cubic-bezier(.3,1.4,.5,1) both">${gl('positivo', 32)}</span>${X('Bandeja al día', 'titulo-seccion')}${X('No hay movimientos por revisar. Los SMS nuevos de tu banco van a aparecer aquí.', 'cuerpo-pequeno', V('texto-secundario'), 'max-width:280px')}${S.smsCola < SMS_GUION.length ? btn('Simular un SMS', 's', 'sms', null, { ic: 'sms', sm: true }) : ''}</div>`;
  else {
    const nP = pend.filter(b => ['listo', 'falta'].includes(claseDe(b))).length, nO = pend.length - nP;
    const summary = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">${X(`${pend.length} por revisar`, 'titulo-seccion')}${X(`${nP} pendiente${nP === 1 ? '' : 's'}${nO ? ' · ' + nO + ' con algo que mirar' : ''}`, 'cuerpo-pequeno', V('texto-secundario'))}</div>`;
    const enL = UI.F._enLugar || {};
    const done = Object.keys(enL).map(bid => { const t = S.transacciones.find(x => x.id === enL[bid]); return t ? `<div data-row="${bid}" style="padding:12px 16px;border-bottom:1px solid var(--borde-sutil);animation:fz-item var(--duracion-normal) var(--curva-estandar) both">${res(`Aprobaste ${esc(t.comercio)} · ${fmt(t.lineas.reduce((a, l) => a + l.monto, 0))} en ${catName(t.lineas[0].cat)}.`, [['Ver transacción', 'go', ['transaccion', t.id]]])}</div>` : ''; }).join('');
    const rows = pend.map((b, i) => { const cl = claseDe(b), [s, l] = CLASE[cl];
      const hint = cl === 'listo' ? '→ ' + catName(F('cat_' + b.id, b.sugerida)) + (b.regla ? ' (por regla)' : '') : cl === 'coincidencia' ? '→ programada ' + (S.programadas.find(p => p.id === b.programada)?.nombre || '') : cl === 'duplicado' ? 'igual a un gasto del ' + fdate(b.fecha) : '';
      const meta = b.cuenta ? `${cuName(b.cuenta)} · ${fdate(b.fecha)} · ${b.banco} ${b.llegada.replace(/^(hoy|ayer) /, '')}` : `${b.banco} · ${b.llegada}`;
      const action = cl === 'listo' ? `<button type="button" data-a="aprobar1" data-p="${P(b.id)}" style="min-height:38px;padding:0 18px;border:none;border-radius:999px;background:var(--accion);color:var(--texto-sobre-accion);font-size:.875rem;font-weight:700">Aprobar</button><button type="button" data-a="go" data-p="${P(['revisar', b.id])}" style="min-height:38px;padding:0 14px;border:none;background:transparent;color:var(--enlace);font-size:.875rem;font-weight:700">Revisar</button>` : '';
      return v2InboxRow(s, l, b.comercio || 'SMS de ' + b.banco, b.monto ? -b.monto : 0, meta, hint, action, 'go', ['revisar', b.id], i === pend.length - 1, 60 * (i + 1)); }).join('');
    body = summary + (listos.length > 1 ? `<div style="display:flex;justify-content:flex-end;margin-top:-8px">${link(`Aprobar todos (${listos.length})`, 'falta', 'aprobar-todos', 'check')}</div>` : '') + v2Box(done + rows) + X('Tocá un movimiento para revisarlo completo. Arrastrar a una categoría es un atajo; los botones siempre están.', 'cuerpo-pequeno', V('texto-terciario'));
  }
  let panel = '';
  if (UI.vista === 'computadora' && vista === 'pend' && pend.length) {
    const sel = pend.find(b => b.id === UI.F._bsel) || pend[0]; UI.F._bsel = sel.id;
    const r = SCR.revisar([sel.id]);
    panel = `<aside aria-label="Revisión" style="position:sticky;top:0;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:20px;background:var(--superficie);box-shadow:var(--elevacion-1);animation:fz-item var(--duracion-normal) var(--curva-estandar) both" data-k="${sel.id}">${r.body}${r.foot ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${r.foot}</div>` : ''}</aside>`;
  }
  return { title: 'Bandeja', body: tabs + body, dbody: panel ? `<div class="dcols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start"><div style="gap:20px">${tabs + body}</div>${panel}</div>` : `<div style="max-width:640px;display:flex;flex-direction:column;gap:20px">${tabs + body}</div>` };
};

/* --------------------------------- Cuentas -------------------------------- */
SCR.cuentas = () => {
  if (!S.cuentas.length) return { title: 'Cuentas', body: empty('wallet', 'Todavía no hay cuentas', 'Agregá tu cuenta del banco, una tarjeta o tu efectivo, con el saldo de hoy.', btn('Crear una cuenta', 'p', 'go', ['cuentaNueva'], { ic: 'plus' })) };
  const cs = Object.values(C.cuentas).filter(c => UI.F._arch || !c.archivada);
  const by = (t) => cs.filter(c => c.tipo === t);
  const tj = by('tarjeta'), ef = by('efectivo'), pr = by('prestamo'), inv = by('inversion');
  const grp = (t, tot, inner) => `<div style="display:flex;flex-direction:column;gap:12px">${v2Gh(t, tot)}${inner}</div>`;
  const parts = [v2Networth(),
    tj.length ? grp('Tarjetas', fmt(tj.reduce((s, c) => s + c.deuda, 0)), v2Wallet(tj)) : '',
    ef.length ? grp('Efectivo', fmt(ef.reduce((s, c) => s + c.saldo, 0)), v2BankTiles(ef)) : '',
    pr.length ? grp('Préstamos', fmt(-pr.reduce((s, c) => s + c.saldo, 0)), pr.map(v2LoanTicket).join('')) : '',
    inv.length ? grp('Inversiones', fmt(inv.reduce((s, c) => s + c.saldo, 0)), inv.map(v2InvestTile).join('')) : '',
    `<label class="chk" style="align-items:center"><input type="checkbox" id="_arch" data-f="_arch" data-live="1"${UI.F._arch ? ' checked' : ''} role="switch"><span>Mostrar archivadas</span></label>`,
    `<div class="acts2">${btn('Nueva cuenta', 's', 'go', ['cuentaNueva'], { ic: 'plus', sm: true })}${btn('Ordenar', 's', 'sheet', ['ordenar'], { ic: 'grip', sm: true })}</div>`];
  return { title: 'Cuentas', body: parts.filter(Boolean).join(''), dbody: `<div class="dcols" style="gap:36px"><div>${[parts[0], parts[2], parts[3], parts[4]].filter(Boolean).join('')}</div><div>${[parts[1], parts[5], parts[6]].filter(Boolean).join('')}</div></div>` };
};


/* Categoría de pago de tarjeta (§2.8, A8/D11) */
function payCat(k, id) {
  const c = C.cuentas[k.pagoDe] || { deuda: 0, falta: 0, reservado: 0, nombre: k.nombre };
  const falta = c.falta || 0, ok = falta < 0.005;
  const pagos = S.transacciones.filter(t => t.tipo === 'pago' && t.destino === k.pagoDe).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const hero = `<div style="display:flex;flex-direction:column;gap:8px">${X(ok ? 'Pago reservado' : 'Te falta reservar', 'rotulo', V('texto-secundario'))}<span data-amt="pay-${id}" data-v="${falta}">${AMT(ok ? c.reservado || k.disponible : falta, 'cifra-principal', ok ? V('positivo-texto') : V('deuda-sin-respaldo-texto'), false, 'font-size:3.25rem')}</span><div>${ok ? ind('positivo', c.deuda > 0 ? 'Cubrís toda la deuda' : 'Sin deuda') : ind('deuda-sin-respaldo', 'Deuda sin reservar')}</div></div>`;
  const kv = `<div style="background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1);padding:16px;display:flex;flex-direction:column;gap:12px">${v2Gauge(c.deuda || 1, Math.max(0, k.disponible), null, null)}<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${v2Kv('Deuda', fmt(c.deuda))}${v2Kv('Reservado', fmt(Math.max(0, k.disponible)))}${v2Kv('Te falta', fmt(falta))}</div></div>`;
  const intereses = c.tarjeta ? v2Section('Para no generar intereses', '', `<div style="background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1);padding:4px 0">${v2Box([['Pago de contado', fmt(c.tarjeta.contado ?? c.deuda), 'Antes del ' + (c.tarjeta.pago || '15') + ' de noviembre'], ['Pago mínimo', fmt(c.tarjeta.minimo ?? Math.round(c.deuda * 5) / 100), 'Genera intereses sobre el resto']].map(([a, b, m], i) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;${i ? '' : 'border-bottom:1px solid var(--borde-sutil)'}"><span style="display:flex;flex-direction:column;gap:1px">${X(a, 'cuerpo', V('texto'), 'font-weight:600')}${X(m, 'cuerpo-pequeno', V('texto-secundario'))}</span>${X(b, 'cuerpo', V('texto'), 'font-weight:700;font-variant-numeric:tabular-nums')}</div>`).join(''))}</div>`) : '';
  const acts = `<div class="acts2">${ok ? btn('Pagar la tarjeta', 'p', 'go', ['pagarTj', k.pagoDe], { full: true }) : btn('Reservar ' + fmt(falta), 'p', 'sheet', ['asignar', id, falta], { full: true })}${btn('Mover dinero', 's', 'sheet', ['mover', id], { full: true, ic: 'swap' })}</div>`;
  const expl = ok ? '' : aviso('deuda-sin-respaldo', `Compraste ${fmt(falta)} con ${esc(c.nombre)} sin dinero asignado. Reservalo para que el pago no salga de otras categorías.`, 'Deuda sin reservar');
  const movs = v2Section('Pagos a la tarjeta', link('Ver la tarjeta', 'go', ['cuenta', k.pagoDe], 'arrowR'), pagos.length ? v2Box(pagos.map((t, i) => v2PlainRow(v2Datebadge(t.fecha), 'Pago desde ' + cuName(t.cuenta), 'Transferencia', AMT(-t.lineas.reduce((s2, l) => s2 + l.monto, 0) || -t.monto || 0, 'cifra'), 'go', ['transaccion', t.id], i === pagos.length - 1)).join('')) : `<div style="padding:16px;background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1)">${X('Todavía no pagaste esta tarjeta en este período.', 'cuerpo-pequeno', V('texto-secundario'))}</div>`);
  ACT.catMenu = () => openMenu(esc(k.nombre), [['swap', 'Mover dinero', 'sheet', ['mover', id]], ['card', 'Ver la tarjeta', 'go', ['cuenta', k.pagoDe]], ['lock', 'Archivar', null, null, 'Las categorías de pago de tarjeta no se archivan.']]);
  const left = [hero, expl, acts, kv], right = [intereses, movs];
  return { title: esc(k.nombre), child: true, back: 'Presupuesto', right: bell() + moreBtn('catMenu'), dright: bell() + moreBtnD('catMenu'), body: [...left, ...right].filter(Boolean).join(''),
    dbody: `<div class="dcols" style="grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:36px"><div style="gap:20px">${left.join('')}</div><div>${right.join('')}</div></div>` };
}

ACT.bsel = (id) => { UI.F._bsel = id; render(); };


</script>
