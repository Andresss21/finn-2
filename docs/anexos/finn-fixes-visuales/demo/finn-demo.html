/* Roles tipográficos (A.5): en rem; los montos con cifras tabulares */
.t-cifra-principal { font-family: var(--fuente-cuerpo); font-size: 2.75rem; line-height: 1.05; font-weight: 800; font-stretch: 72%; font-variant-numeric: tabular-nums; }
.t-cifra { font-family: var(--fuente-cuerpo); font-size: 1.25rem; line-height: 1.25; font-weight: 700; font-stretch: 80%; font-variant-numeric: tabular-nums; }
.t-titulo-pantalla { font-family: var(--fuente-titulo); font-size: 2rem; line-height: 1.05; font-weight: 800; letter-spacing: .01em; text-transform: uppercase; }
.t-titulo-seccion { font-family: var(--fuente-titulo); font-size: 1.375rem; line-height: 1.15; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
.t-cuerpo { font-family: var(--fuente-cuerpo); font-size: 1rem; line-height: 1.5; font-weight: 400; }
.t-cuerpo-pequeno { font-family: var(--fuente-cuerpo); font-size: .875rem; line-height: 1.45; font-weight: 400; }
.t-etiqueta { font-family: var(--fuente-cuerpo); font-size: .875rem; line-height: 1.35; font-weight: 500; }
.t-rotulo { font-family: var(--fuente-cuerpo); font-size: .75rem; line-height: 1.3; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

}


/* Propuesta: colores de tarjeta adicionales (texto verificado ≥ 4.5:1 contra el tono más claro) */
:root {
  --tarjeta-grafito: linear-gradient(135deg, #08090B 0%, #16181C 40%, #24272D 78%, #2E3138 100%);
  --tarjeta-grafito-texto: #F2F4F6;
  --tarjeta-zafiro: linear-gradient(135deg, #06142E 0%, #0D2652 40%, #1B3F82 78%, #24509A 100%);
  --tarjeta-zafiro-texto: #F2F5FF;
  --tarjeta-rubi: linear-gradient(135deg, #1E0609 0%, #3F0D15 40%, #6E1A28 78%, #7E2231 100%);
  --tarjeta-rubi-texto: #FFF1F2;
  --tarjeta-esmeralda: linear-gradient(135deg, #03170F 0%, #0A2E20 40%, #145238 78%, #1A6043 100%);
  --tarjeta-esmeralda-texto: #EEFBF4;
  --tarjeta-amatista: linear-gradient(135deg, #140A24 0%, #2A1548 40%, #45267A 78%, #52308C 100%);
  --tarjeta-amatista-texto: #F6F1FF;
  --tarjeta-cobre: linear-gradient(135deg, #1A0D06 0%, #3B1D0E 40%, #6B3A1E 78%, #7C4626 100%);
  --tarjeta-cobre-texto: #FFF4EC;
}
/* Finn 2.0 · demo navegable. Componentes v2 como clases; todo color, radio y movimiento sale de tokens.css. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--superficie-hundida); color: var(--texto); font-family: var(--fuente-cuerpo); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* --- chrome de la demo (fuera del dispositivo) --- */
.demo { min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; gap: 16px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--superficie); border-radius: var(--radio-contenedor); box-shadow: var(--elevacion-1); }
.bar .brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.bar .brand b { font-family: var(--fuente-titulo); font-size: 1.375rem; text-transform: uppercase; letter-spacing: .01em; }
.bar .brand span { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-secundario); }
.dseg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--superficie-hundida); }
.dseg button { border: none; background: transparent; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: .875rem; font-weight: 500; color: var(--texto-secundario); }
.dseg button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); font-weight: 700; box-shadow: var(--elevacion-1); }
.dbtn { border: none; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--superficie-hundida); font-size: .875rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.dbtn.on { background: var(--marca); color: var(--texto-sobre-marca); }
.dbtn .pill { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accion); color: var(--texto-sobre-accion); font-size: .75rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.stage { display: flex; gap: 24px; align-items: flex-start; justify-content: center; flex: 1; min-width: 0; }
.side { width: 360px; flex: none; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 120px); overflow-y: auto; position: sticky; top: 12px; }
.side { text-align: left; }
.side .box { flex: none; background: var(--superficie); border-radius: var(--radio-contenedor); box-shadow: var(--elevacion-1); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.side h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 1.125rem; text-transform: uppercase; letter-spacing: .01em; }
.side p { margin: 0; font-size: .875rem; line-height: 1.45; color: var(--texto-secundario); }
.trail { display: flex; flex-direction: column; gap: 2px; font-size: .8125rem; }
.trail button { text-align: left; border: none; background: transparent; padding: 6px 8px; border-radius: var(--radio-control); display: flex; gap: 8px; align-items: baseline; }
.trail button:hover { background: var(--superficie-hundida); }
.trail code { font-size: .75rem; color: var(--texto-terciario); }
.miss { display: flex; flex-direction: column; gap: 6px; }
.miss button { text-align: left; border: none; padding: 10px 12px; border-radius: var(--radio-control); background: var(--superficie-hundida); display: flex; flex-direction: column; gap: 2px; font-size: .875rem; }
.miss button b { font-weight: 700; }
.miss button small { color: var(--texto-secundario); font-size: .75rem; }
.miss button.seen { box-shadow: inset 3px 0 0 var(--advertencia-borde); }
@media (max-width: 1100px) { .side { display: none; } .side.open { display: flex; position: fixed; inset: 64px 16px 16px; width: auto; max-height: none; z-index: 60; } }
}

/* --- dispositivo --- */
.device { position: relative; overflow: hidden; background: var(--fondo); border: 1px solid var(--borde-sutil); box-shadow: var(--elevacion-3); flex: none; }
.device.phone { width: 390px; height: 844px; border-radius: 44px; }
.device.desk { width: 1440px; height: 900px; border-radius: 14px; display: flex; flex: none; }
.fit { flex: none; position: relative; }
.scr { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
.scr::-webkit-scrollbar { display: none; }
.device.desk .scr { position: relative; flex: 1; inset: auto; height: 100%; }

/* barra superior (teléfono) */
.top { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 4px; padding: 20px 12px 8px 20px; background: var(--fondo); }
.top h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--fuente-titulo); font-weight: 800; font-size: 1.75rem; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top.child h1 { font-size: 1.625rem; }
.back { display: flex; align-items: center; gap: 4px; border: none; background: transparent; min-height: 44px; padding: 0 8px 0 0; margin-left: -8px; font-size: .875rem; font-weight: 600; color: var(--texto-secundario); }
.topwrap { position: sticky; top: 0; z-index: 15; background: var(--fondo); }
.topwrap .crumb { padding: 16px 20px 0; }
.ib { width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; display: inline-flex; align-items: center; justify-content: center; flex: none; position: relative; }
.ib.fill { background: var(--superficie-hundida); }
.ib .dot { position: absolute; top: 6px; right: 5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--accion); color: var(--texto-sobre-accion); font-size: .6875rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.regbtn { display: inline-flex; align-items: center; gap: 2px; min-height: 36px; padding: 0 12px 0 8px; font-size: .8125rem !important; transition: transform var(--duracion-rapida) var(--curva-estandar); border: none; border-radius: 999px; background: var(--accion); color: var(--texto-sobre-accion); font-size: .875rem; font-weight: 700; flex: none; }
.content { padding: 8px 20px 140px; display: flex; flex-direction: column; gap: 24px; }
.content.flow { padding-bottom: 200px; }
.anim > * { animation: fz-in var(--duracion-lenta) var(--curva-estandar) both; }
.anim > *:nth-child(2) { animation-delay: 40ms; } .anim > *:nth-child(3) { animation-delay: 80ms; } .anim > *:nth-child(4) { animation-delay: 120ms; } .anim > *:nth-child(n+5) { animation-delay: 160ms; }

.box { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: var(--radio-control) var(--radio-control) 4px 4px; background: var(--superficie); box-shadow: inset 0 -2px 0 var(--borde-control); }

/* ============================================================================
   Motor simplificado (no es el motor de 01): saldos, Disponibles, Listo para
   asignar, pagos de tarjeta y estados. Suficiente para que cada acción de la
   demo mueva los números en todas las pantallas.
   ========================================================================== */
const r2 = (n) => Math.round(n * 100) / 100;
const fmt = (n, plus) => {
  const v = r2(n), a = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? '−' : (plus && v > 0 ? '+' : '')) + '$' + a;
};
const fdate = (d) => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}` : '';
const fdateY = (d) => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : '';
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const dia = (d) => DIAS[new Date(d + 'T12:00:00').getDay()];
const enPeriodo = (d) => d >= PERIODO.inicio && d <= PERIODO.fin;

function calc(S) {
  const C = {};
  const cuentas = {};
  S.cuentas.forEach(c => { cuentas[c.id] = { ...c, saldo: c.saldoInicial }; });
  const asign = S.asignaciones[PERIODO.inicio] || {};
  const cats = {};
  S.categorias.forEach(k => { cats[k.id] = { ...k, asignado: asign[k.id] || 0, arrastre: (S.arrastre || {})[k.id] || 0, actividad: 0, cubierto: 0, sinCubrir: 0, pagos: 0 }; });
  let ingresos = 0, porCobrar = {}, enCamino = 0;
  // efectivo inicial entra a LPA; la deuda inicial de tarjeta queda como "te falta reservar"
  S.cuentas.forEach(c => { if (c.tipo === 'efectivo') ingresos += c.saldoInicial; });
  const txs = [...S.transacciones].sort((a, b) => a.fecha.localeCompare(b.fecha) || a.id.localeCompare(b.id));
  txs.forEach(t => {
    const cu = cuentas[t.cuenta]; if (!cu) return;
    const total = t.lineas.reduce((s, l) => s + l.monto, 0);
    if (t.tipo === 'ingreso') { cu.saldo += total; ingresos += total; }
    else if (t.tipo === 'transferencia') { cu.saldo -= total; if (cuentas[t.destino]) cuentas[t.destino].saldo += total; }
    else if (t.tipo === 'pago') { cu.saldo -= total; const tj = cuentas[t.destino]; if (tj) { tj.saldo += total; const pk = S.categorias.find(k => k.pagoDe === tj.id); if (pk) cats[pk.id].pagos += total; } }
    else if (t.tipo === 'gasto') {
      cu.saldo -= total;
      t.lineas.forEach(l => {
        if (l.deudor) { const cobrado = (t.eventos || []).filter(e => e.tipo === 'cobro' && e.deudor === l.deudor).reduce((s, e) => s + e.monto, 0);
          porCobrar[l.deudor] = porCobrar[l.deudor] || []; porCobrar[l.deudor].push({ tx: t, monto: l.monto, cobrado, abierto: r2(l.monto - cobrado) });
          if (cu.tipo === 'efectivo') enCamino += l.monto - cobrado; return; }
        const k = cats[l.cat]; if (!k) return;
        if (!enPeriodo(t.fecha)) return;
        const antes = k.arrastre + k.asignado + k.actividad;
        k.actividad -= l.monto;
        if (cu.tipo === 'tarjeta') {
          const cub = Math.max(0, Math.min(l.monto, antes));
          k.cubierto += cub; k.sinCubrir += l.monto - cub;
          const pk = S.categorias.find(x => x.pagoDe === cu.id); if (pk) cats[pk.id].cubierto += cub;
        }
      });
    }
    (t.eventos || []).forEach(e => { if (e.tipo === 'cobro' && cuentas[e.cuenta]) { cuentas[e.cuenta].saldo += e.monto; if (cuentas[e.cuenta].tipo === 'efectivo') ingresos += 0; } });
  });
  let asignadoTotal = 0;
  Object.values(cats).forEach(k => {
    asignadoTotal += k.asignado + k.arrastre;
    if (k.pagoDe) { k.disponible = r2(k.asignado + k.cubierto - k.pagos); }
    else k.disponible = r2(k.arrastre + k.asignado + k.actividad);
    k.gastado = r2(-k.actividad);
    k.falta = k.meta ? r2(Math.max(0, (k.meta.tipo === 'fecha' ? Math.min(k.meta.monto, 245.38) : k.meta.monto) - k.asignado)) : 0;
    k.estado = estadoCat(k, cuentas);
  });
  // cobros en efectivo devuelven a LPA
  S.transacciones.forEach(t => (t.eventos || []).forEach(e => { if (e.tipo === 'cobro' && cuentas[e.cuenta] && cuentas[e.cuenta].tipo === 'efectivo') ingresos += e.monto; }));
  // por cobrar pagados con efectivo bajan LPA mientras están abiertos
  C.lpa = r2(ingresos - asignadoTotal - enCamino);
  C.ingresos = r2(ingresos); C.asignado = r2(asignadoTotal); C.enCamino = r2(enCamino);
  Object.values(cuentas).forEach(c => {
    c.saldo = r2(c.saldo);
    if (c.tipo === 'tarjeta') {
      const pk = Object.values(cats).find(k => k.pagoDe === c.id);
      c.deuda = r2(Math.max(0, -c.saldo));
      c.reservado = pk ? Math.max(0, pk.disponible) : 0;
      c.falta = r2(Math.max(0, c.deuda - c.reservado));
    }
  });
  C.cuentas = cuentas; C.cats = cats; C.porCobrar = porCobrar;
  C.efectivo = r2(Object.values(cuentas).filter(c => c.tipo === 'efectivo' && !c.archivada).reduce((s, c) => s + c.saldo, 0));
  C.deudas = r2(Object.values(cuentas).filter(c => c.tipo === 'tarjeta' || c.tipo === 'prestamo').reduce((s, c) => s + c.saldo, 0));
  C.inversiones = r2(Object.values(cuentas).filter(c => c.tipo === 'inversion').reduce((s, c) => s + c.saldo, 0));
  C.patrimonio = r2(C.efectivo + C.deudas + C.inversiones);
  C.pendientes = S.bandeja.filter(b => b.estado === 'pendiente');
  C.noLeidas = S.notificaciones.filter(n => !n.leida).length;
  C.atencion = atencion(S, C);
  C.pasos = { cuenta: S.cuentas.length > 0, categorias: S.categorias.some(k => !k.pagoDe), sms: !!S.ajustes.webhook.token };
  return C;
}

function estadoCat(k, cuentas) {
  if (k.pagoDe) {
    const c = cuentas[k.pagoDe]; if (!c) return ['cero', 'Sin deuda'];
    const deuda = Math.max(0, -c.saldo);
    if (deuda === 0) return ['positivo', 'Nada que pagar'];
    const falta = deuda - Math.max(0, k.disponible);
    return falta > 0.004 ? ['deuda-sin-respaldo', 'Te falta reservar ' + fmt(falta)] : ['positivo', 'Pago reservado'];
  }
  if (k.disponible < -0.004) return k.sinCubrir > 0 ? ['deuda-sin-respaldo', 'Deuda sin reservar'] : ['problema', 'Sobregirada'];
  if (k.falta > 0.004) return ['advertencia', 'Falta ' + fmt(k.falta) + ' para la meta'];
  if (k.disponible === 0 && k.asignado > 0) return ['cero', 'Gastada'];
  if (k.disponible === 0) return ['cero', 'Sin fondos'];
  return ['positivo', 'Con fondos'];
}

function atencion(S, C) {
  const a = [];
  if (C.lpa < -0.004) a.push({ s: 'problema', t: 'Asignaste más de lo que tenés', d: `Listo para asignar está en ${fmt(C.lpa)}. Quitá dinero de alguna categoría.`, go: ['presupuesto'] });
  Object.values(C.cats).filter(k => !k.pagoDe && k.disponible < -0.004).forEach(k => a.push({ s: k.estado[0], t: `${k.nombre} está sobregirada`, d: `Disponible ${fmt(k.disponible)}. Cubrilo moviendo dinero de otra categoría.`, go: ['categoria', k.id], act: ['sheet', 'mover', k.id], actL: 'Mover dinero' }));
  Object.values(C.cuentas).filter(c => c.tipo === 'tarjeta' && c.falta > 0.004).forEach(c => a.push({ s: 'deuda-sin-respaldo', t: `${c.nombre}: te falta reservar ${fmt(c.falta)}`, d: `Corta el ${c.tarjeta.corte}/10. Asigná a su categoría de pago para cubrir la deuda.`, go: ['cuenta', c.id] }));
  if (C.pendientes.length) a.push({ s: 'informacion', t: `${C.pendientes.length} movimiento${C.pendientes.length > 1 ? 's' : ''} por revisar`, d: 'Llegaron por SMS y esperan en la Bandeja.', go: ['bandeja'] });
  if (C.lpa > 0.004 && S.categorias.length) a.push({ s: 'positivo', t: `Tenés ${fmt(C.lpa)} para asignar`, d: 'Repartilo entre tus categorías.', go: ['presupuesto'], act: ['sheet', 'auto'], actL: 'Auto-asignar' });
  return a;
}

/* ----------------------------- acciones ---------------------------------- */
const nid = (S, p) => p + (++S.seq);
const A = {
  aprobar(S, b, campos) {
    const t = { id: nid(S, 't'), fecha: campos.fecha || b.fecha, cuenta: campos.cuenta || b.cuenta, tipo: 'gasto', comercio: campos.comercio || b.comercio,
      lineas: campos.lineas || [{ cat: campos.cat || b.sugerida, monto: b.monto }], estado: 'confirmada', origen: 'sms', nota: campos.nota || '', eventos: [] };
    S.transacciones.push(t); b.estado = 'aprobado'; b.tx = t.id;
    if (campos.recordar && t.lineas.length === 1) S.reglas.push({ id: nid(S, 'r'), patron: t.comercio.split(' ').slice(0, 2).join(' '), cat: t.lineas[0].cat, usos: 1 });
    if (b.programada) { const p = S.programadas.find(x => x.id === b.programada); if (p) p.proxima = '2026-11-17'; }
    return t;
  },
  descartar(S, b) { b.estado = 'descartado'; },
  restaurar(S, b) { b.estado = 'pendiente'; },
  asignar(S, catId, monto) { const a = S.asignaciones[PERIODO.inicio] = S.asignaciones[PERIODO.inicio] || {}; a[catId] = r2((a[catId] || 0) + monto); },
  mover(S, de, a, monto) { A.asignar(S, de, -monto); A.asignar(S, a, monto); },
  registrar(S, t) { t.id = nid(S, 't'); t.eventos = t.eventos || []; t.estado = t.estado || 'confirmada'; S.transacciones.push(t); return t; },
  eliminarTx(S, id) { S.transacciones = S.transacciones.filter(t => t.id !== id); },
  smsLlega(S) {
    const i = S.smsCola; if (i >= SMS_GUION.length) return null;
    const b = adaptarSms(S, { ...SMS_GUION[i], id: 'b' + (i + 1), estado: 'pendiente' }); S.bandeja.unshift(b); S.smsCola = i + 1;
    S.ajustes.webhook.ultimoSms = '2026-10-15T' + (10 + i) + ':00';
    return b;
  },
};

/* El guion usa las cuentas y categorías de los datos de ejemplo; en el recorrido desde cero se adapta a lo que creó el usuario. */
const NOMBRES_CAT = { 'k-super': ['supermercado'], 'k-netflix': ['netflix', 'streaming'], 'k-gas': ['gasolina'] };
function adaptarSms(S, b) {
  if (!b.cuenta) return b;
  const tj = b.cuenta === 'c3';
  if (!S.cuentas.find(c => c.id === b.cuenta)) {
    const alt = S.cuentas.find(c => !c.archivada && c.tipo === (tj ? 'tarjeta' : 'efectivo')) || S.cuentas.find(c => !c.archivada);
    b.cuenta = alt ? alt.id : null;
  }
  if (b.sugerida && !S.categorias.find(k => k.id === b.sugerida)) {
    const ns = NOMBRES_CAT[b.sugerida] || [];
    const k = S.categorias.find(k => !k.archivada && ns.includes(k.nombre.toLowerCase()));
    b.sugerida = k ? k.id : null;
  }
  if (b.regla && !S.reglas.find(r => r.id === b.regla)) b.regla = null;
  if (b.clase === 'listo' && !b.sugerida) b.clase = 'falta';
  if (b.clase === 'coincidencia' && !S.programadas.find(p => p.id === b.programada)) { b.clase = b.sugerida ? 'listo' : 'falta'; b.programada = null; }
  if (b.clase === 'duplicado' && !S.transacciones.find(t => t.id === b.duplicadoDe)) { b.clase = b.sugerida ? 'listo' : 'falta'; b.duplicadoDe = null; }
  return b;
}

/* Piezas de interfaz (las mismas de A.6 v2, como funciones que devuelven HTML). */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = (o) => esc(JSON.stringify(o ?? null));
const on = (a, p) => a ? ` data-a="${a}" data-p="${P(p)}"` : '';
function ic(n, s = 20) { return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex:none;display:block">${IC[n] || ''}</svg>`; }
function gl(st, s = 14) { const g = GL[st] || GL.cero; return `<svg width="${s}" height="${s}" viewBox="${g[0]}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true">${g[1]}</svg>`; }
const SYM = (s = 16) => `<svg viewBox="18 14 66 72" width="${Math.round(s * 66 / 72)}" height="${s}" fill="currentColor" aria-hidden="true"><rect x="18" y="14" width="18" height="72" rx="5"/><rect x="41" y="14" width="43" height="20" rx="5"/><rect x="41" y="40" width="29" height="18" rx="5"/></svg>`;
const ind = (st, label, sm) => `<span class="ind s-${st}${sm ? ' sm' : ''}"><i>${gl(st, sm ? 12 : 14)}</i>${esc(label)}</span>`;
const amt = (v, cls = '', plus) => `<span class="amt ${cls}">${fmt(v, plus)}</span>`;
const disc = (i, style = '') => `<span class="disc" style="${style}">${ic(i)}</span>`;
function row({ left = '', title, sub = '', right = '', a, p, chev = true, href = true, sub2 = '' }) {
  const tag = a && href ? 'button' : 'div';

}
const list = (rows) => `<div class="list">${rows.filter(Boolean).join('')}</div>`;
const surf = (inner, style = '') => `<div class="surf" style="${style}">${inner}</div>`;
const sec = (title, inner, right = '') => `<section class="sec"><div class="sech"><h2>${title}</h2>${right}</div>${inner}</section>`;
const link = (label, a, p, i, cls = '') => `<button type="button" class="link ${cls}"${on(a, p)}>${i ? ic(i, 16) : ''}${label}</button>`;
function aviso(s, text, title, acts = [], role = 'status') {
  return `<div class="aviso a-${s}" role="${role}"><span style="padding-top:2px">${gl(s, 20)}</span><div>${title ? `<b>${title}</b>` : ''}<p>${text}</p>${acts.length ? `<div class="acts">${acts.map(x => link(x[0], x[1], x[2])).join('')}</div>` : ''}</div></div>`;
}
const nota = (text, i = 'info') => `<div class="nota">${ic(i, 18)}<span>${text}</span></div>`;
const res = (text, acts = [], i = 'check') => `<div class="res" role="status">${ic(i, 18)}<span>${text}</span>${acts.map(x => link(x[0], x[1], x[2], x[3])).join('')}</div>`;
function btn(label, kind = 'p', a, p, o = {}) {
  const b = `<button type="button" class="btn ${kind}${o.full ? ' full' : ''}${o.sm ? ' sm' : ''}"${o.dis ? ' disabled' : ''}${o.busy ? ' aria-busy="true"' : ''}${on(o.dis ? null : a, p)}>${o.busy ? '<span class="spin"></span>' : (o.ic ? ic(o.ic, 18) : '')}${label}</button>`;
  return o.motive && o.dis ? `<div class="stack" style="gap:8px">${b}<p class="motive">${o.motive}</p></div>` : b;
}
const fmsg = (m) => m ? `<p class="fmsg" role="alert">${gl('problema', 16)}<span>${m}</span></p>` : '';
function fld(id, label, val = '', o = {}) {

    : `<div class="box${o.err ? ' err' : ''}">${o.pre ? `<span class="pre">${o.pre}</span>` : ''}<input id="${id}" data-f="${id}" value="${esc(val)}" placeholder="${esc(o.ph || '')}"${o.num ? ' inputmode="decimal"' : ''}${o.live ? ' data-live="1"' : ''}${o.type ? ` type="${o.type}"` : ''} autocomplete="off">${o.suf || ''}</div>`;
  return `<div class="fld"><label for="${id}">${label}${o.opt ? '<small>Opcional</small>' : ''}${o.ro ? '<small>Solo lectura</small>' : ''}</label>${box}${o.err ? fmsg(o.err) : (o.hint ? `<p class="fhint">${o.hint}</p>` : '')}</div>`;

function sel(label, value, sub, a, p, o = {}) {
  return `<div class="fld"><span class="flab">${label}</span><button type="button" class="sel${o.ph ? ' ph' : ''}${o.err ? ' err' : ''}"${on(a, p)}${o.dis ? ' disabled' : ''}><span class="hrow" style="gap:12px;flex-wrap:nowrap;min-width:0">${o.ic ? ic(o.ic) : ''}<span class="v"><b>${value}</b>${sub ? `<span class="num">${sub}</span>` : ''}</span></span>${ic('chevD', 18)}</button>${fmsg(o.err)}</div>`;
}
const chips = (items, cur, a, label = 'Filtro') => `<div class="chips" role="tablist" aria-label="${label}">${items.map(([k, l]) => `<button type="button" class="chip" aria-pressed="${k === cur}"${on(a, k)}>${l}</button>`).join('')}</div>`;
const seg = (items, cur, a, label) => `${label ? `<span class="flab" style="font-size:.875rem;font-weight:500">${label}</span>` : ''}<div class="seg" role="radiogroup">${items.map(([k, l]) => `<button type="button" aria-pressed="${k === cur}"${on(a, k)}>${l}</button>`).join('')}</div>`;
const chk = (id, val, label, sub) => `<label class="chk"><input type="checkbox" id="${id}" data-f="${id}" data-live="1"${val ? ' checked' : ''}><span>${label}${sub ? `<small>${sub}</small>` : ''}</span></label>`;
const opt = (val, title, sub, a, p, right = '') => `<button type="button" class="opt" role="radio" aria-checked="${!!val}"${on(a, p)}><span class="rd"></span><span class="tt"><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</span>${right}</button>`;
const empty = (i, t, d, b = '') => `<div class="empty">${disc(i)}<h3>${t}</h3><p>${d}</p>${b}</div>`;
const kvs = (pairs) => `<div>${pairs.map(([k, v, strong, cls]) => `<div class="kv${strong ? ' strong' : ''}"><span>${k}</span><b class="${cls || ''}">${v}</b></div>`).join('')}</div>`;
const datebadge = (d) => `<span class="datebadge"><b>${d.slice(8, 10)}</b><span>${MESES3[+d.slice(5, 7) - 1]}</span></span>`;
const newd = (t = 'Diseñada en la demo') => `<span class="newdesign">${ic('plus', 12)}${t}</span>`;
function bar8(gastado, asignado, over) {
  const tot = Math.max(asignado, gastado, 0.01);
  const g = Math.min(gastado, asignado) / tot * 100, o = Math.max(0, gastado - asignado) / tot * 100;
  return `<div class="bar8" aria-hidden="true"><span style="width:${g.toFixed(1)}%"></span>${o > 0 ? `<span class="over" style="width:${o.toFixed(1)}%"></span>` : ''}</div>`;
}
function barras(vals, labels, hi) {
  const w = 340, h = 180, mx = Math.ceil(Math.max(...vals) * 1.1 / 100) * 100 || 100, bw = (w - 44) / vals.length;
  let g = '';
  for (let k = 0; k < 4; k++) { const y = 10 + (h - 30) * k / 3; g += `<line x1="44" x2="${w}" y1="${y}" y2="${y}" stroke="var(--grafico-rejilla)"/><text x="38" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--texto-secundario)">$${Math.round(mx * (3 - k) / 3)}</text>`; }
  vals.forEach((v, i) => { const bh = (h - 30) * v / mx, x = 44 + i * bw + bw * .2; g += `<rect x="${x}" y="${10 + (h - 30) - bh}" width="${bw * .6}" height="${bh}" rx="5" fill="${i === hi ? 'var(--accion)' : 'var(--grafico-tinta)'}"/><text x="${x + bw * .3}" y="${h - 4}" text-anchor="middle" font-size="11" fill="var(--texto-secundario)">${labels[i]}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de barras" font-family="Archivo, system-ui, sans-serif">${g}</svg></div>`;
}
function dona(parts) {
  const tot = parts.reduce((s, p) => s + p[1], 0) || 1; let a0 = -Math.PI / 2, out = '';
  parts.forEach(([n, v, col]) => { const a1 = a0 + v / tot * Math.PI * 2, R = 70, r = 46, cx = 80, cy = 80, lg = a1 - a0 > Math.PI ? 1 : 0;
    const p = (a, rr) => `${cx + rr * Math.cos(a)} ${cy + rr * Math.sin(a)}`;
    out += `<path d="M${p(a0, R)} A${R} ${R} 0 ${lg} 1 ${p(a1 - .02, R)} L${p(a1 - .02, r)} A${r} ${r} 0 ${lg} 0 ${p(a0, r)}Z" fill="${col}"/>`; a0 = a1; });
  return `<svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Gasto por categoría" style="align-self:center">${out}</svg>`;
}

/* ============================================================================
   Núcleo: estado, rutas, marco (teléfono / computadora), hojas, menús y la
   barra de la demo con el recorrido y las pantallas que faltan.
   ========================================================================== */
const KEY = 'finn-demo-v3';
let S, C;
const UI = { vista: 'telefono', ruta: { n: 'ingresar', p: [] }, hist: [], sheet: null, menu: null, flash: {}, F: {}, trail: [], vistos: {}, panel: false, forzar: null, tema: 'sistema' };
const SCR = {};      // pantallas: (p) => ({ title, body, ... })
const SHEETS = {};   // hojas cortas: (p) => ({ title, sub, body, acts })
const ACT = {};      // acciones de data-a

function cargar() {
  try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j && j.v === 3) { S = j.S; Object.assign(UI, { ruta: j.ruta || UI.ruta, vista: j.vista || UI.vista, trail: j.trail || [], vistos: j.vistos || {}, tema: j.tema || 'sistema' }); return; } } catch (e) {}
  S = semillaNueva();
}
function guardar() { try { localStorage.setItem(KEY, JSON.stringify({ v: 3, S, ruta: UI.ruta, vista: UI.vista, trail: UI.trail.slice(-80), vistos: UI.vistos, tema: UI.tema })); } catch (e) {} }

/* --------------------------------- rutas --------------------------------- */
const NAVI = { inicio: 0, presupuesto: 1, bandeja: 2, actividad: 3, cuentas: 4 };
function dirFor(n, kind) {
  if (kind === 'back') return 'back';
  if (kind === 'tab') { const a = NAVI[SECCION[UI.ruta.n] || UI.ruta.n], b = NAVI[n]; return a == null || b == null ? 'tab' : (b > a ? 'right' : b < a ? 'left' : 'tab'); }
  try { const v = SCR[n](UI.tmpP || []); if (v.flow) return 'up'; } catch (e) {}
  return 'push';
}
function go(n, ...p) {
  if (!SCR[n]) { n = 'falta'; p = ['?']; }
  UI.tmpP = p; UI.dir = UI.dirNext || dirFor(n); UI.dirNext = null; UI.notif = false;
  UI.hist.push(UI.ruta); UI.ruta = { n, p }; UI.sheet = null; UI.menu = null; UI.F = {};
  const t = titulo(n, p); UI.trail.push({ n, p, t });
  if (n === 'falta') UI.vistos[p[0]] = true;
  render(true);
}
function back() { UI.dir = 'back'; UI.notif = false; const r = UI.hist.pop(); if (r) { UI.ruta = r; UI.sheet = null; UI.menu = null; UI.F = {}; render(true); } else go('inicio'); }
function replace(n, ...p) { UI.dir = UI.dir || 'tab'; UI.ruta = { n, p }; UI.sheet = null; UI.menu = null; UI.F = {}; UI.trail.push({ n, p, t: titulo(n, p) }); render(true); }
function titulo(n, p) { try { return SCR[n](p).title || n; } catch (e) { return n; } }
const sheet = (n, p) => { UI.sheet = { n, p }; UI.menu = null; UI.F = UI.F || {}; render(); };
/* Cierre con animación de salida (200 ms, --curva-salida) antes de desmontar. */
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function closeOverlay(fn) {
  const app = document.getElementById('app');
  const els = app.querySelectorAll('.sheet, .velo, .menu, [role="dialog"].fz-dr-in');
  if (!els.length || RM()) { fn(); render(); return; }
  els.forEach(e => e.classList.add('closing'));
  setTimeout(() => { fn(); render(); }, 190);
}
const closeSheet = () => closeOverlay(() => { UI.sheet = null; });
const flash = (html, n = UI.ruta.n) => { UI.flash[n] = html; };

/* ------------------------------- marco ----------------------------------- */
const NAV = [['inicio', 'home', 'Inicio'], ['presupuesto', 'grid', 'Presupuesto'], ['bandeja', 'inbox', 'Bandeja'], ['actividad', 'activity', 'Actividad'], ['cuentas', 'wallet', 'Cuentas']];
const SECCION = { inicio: 'inicio', presupuesto: 'presupuesto', categoria: 'presupuesto', lpa: 'presupuesto', estructura: 'presupuesto', bandeja: 'bandeja', revisar: 'bandeja', actividad: 'actividad', transaccion: 'actividad', cuentas: 'cuentas', cuenta: 'cuentas' };
function bell() { return `<button type="button" class="ib" aria-label="Notificaciones${C.noLeidas ? ', ' + C.noLeidas + ' sin leer' : ''}" data-a="openNotif">${ic('bell', 22)}${C.noLeidas ? `<span class="dot">${C.noLeidas}</span>` : ''}</button>`; }
function navPhone(cur) {
  const n = C.pendientes.length;
  return `<nav class="nav" aria-label="Principal">${NAV.map(([k, i, l]) => k === 'bandeja'
    ? `<button type="button" class="inbox"${cur === k ? ' aria-current="page"' : ''} data-a="nav" data-p='"bandeja"' aria-label="Bandeja${n ? ', ' + n + ' por revisar' : ''}"><span class="sq">${n && cur !== k ? '<span class="halo"></span>' : ''}${ic('inbox', 24)}${n ? `<span class="badge">${n}</span>` : ''}</span>Bandeja</button>`
    : `<button type="button"${cur === k ? ' aria-current="page"' : ''} data-a="nav" data-p='"${k}"'>${ic(i, 22)}${l}</button>`).join('')}</nav>`;
}
function sidebar(cur) {
  const n = C.pendientes.length;
  const more = [['reportes', 'chart', 'Reportes'], ['metas', 'target', 'Metas'], ['programadas', 'repeat', 'Programadas'], ['porcobrar', 'user', 'Por cobrar'], ['reglas', 'filter', 'Reglas'], ['ajustes', 'gear', 'Ajustes']];
  const it = ([k, i, l]) => `<button type="button" class="it"${cur === k ? ' aria-current="page"' : ''} data-a="nav" data-p='"${k}"'>${ic(i, 20)}<span style="flex:1">${l}</span>${k === 'bandeja' && n ? `<span class="n">${n}</span>` : ''}</button>`;
  const it2 = ([k, i, l]) => `<button type="button" class="it2"${cur === k ? ' aria-current="page"' : ''} data-a="nav" data-p='"${k}"'>${ic(i, 18)}<span style="flex:1">${l}</span></button>`;
  return `<aside class="sidebar"><div class="logo"><span class="sym">${SYM(16)}</span><b>Finn</b></div>${btn('Registrar', 'p', 'go', ['registrar'], { full: true, ic: 'plus' })}<nav aria-label="Principal" class="snav">${NAV.map(it).join('')}</nav><div class="snav"><span class="lbl" style="padding:0 12px 6px;color:var(--texto-terciario)">Más</span>${more.map(it2).join('')}</div></aside>`;
}
function render(top) {
  C = calc(S);
  const root = document.getElementById('app');
  const prevScroll = root.querySelector('.scr')?.scrollTop || 0;
  const act = document.activeElement, actId = act && act.id, selS = act && act.selectionStart;
  const r = UI.ruta;
  let v;
  try { v = (SCR[r.n] || SCR.falta)(r.p); } catch (e) { console.error(e); v = { title: 'Error', body: `<div class="content">${aviso('problema', esc(e.message), 'Error de la demo')}</div>` }; }
  if (UI.forzar && SCR['forzado'] && !v.access) v = SCR.forzado([UI.forzar, v]);
  const phone = UI.vista === 'telefono';
  const sec_ = SECCION[r.n] || (v.sec ?? null);
  const fl = UI.flash[r.n]; delete UI.flash[r.n];
  const body = (fl ? fl : '') + v.body;
  let inner;
  if (v.access) inner = `<div class="scr">${v.body}</div>`;
  else if (phone) {
    const SEC2 = ['reportes', 'metas', 'programadas', 'porcobrar', 'reglas', 'ajustes'];
    const right = v.right ?? (v.flow ? '' : v.child || SEC2.includes(r.n) ? bell() : `<button type="button" class="regbtn${String(v.title).length > 8 ? ' solo' : ''}" data-a="go" data-p='["registrar"]' aria-label="Registrar">${ic('plus', 18)}<span>Registrar</span></button>${bell()}<button type="button" class="ib" aria-label="Más secciones" data-a="sheet" data-p='["mas"]'>${ic('menu', 22)}</button>`);
    const lead = v.flow ? `<button type="button" class="ib" aria-label="Cerrar" data-a="back" style="margin-left:-12px">${ic('x', 22)}</button>`
      : v.child ? `<button type="button" class="ib" aria-label="Volver a ${esc(v.back || 'la pantalla anterior')}" data-a="back" style="margin-left:-12px">${ic('arrowL', 22)}</button>` : '';
    const head = v.child || v.flow ? `<div class="topwrap"><header class="top child">${lead}<h1>${v.title}</h1>${right}</header></div>`
      : `<header class="top"><h1>${v.title}</h1>${right}</header>`;
    inner = `<div class="scr${top && UI.dir ? ' fz-d-' + UI.dir : ''}">${head}<main class="content${v.flow || v.foot ? ' flow' : ''}${top ? ' stg' : ''}">${body}</main></div>${v.foot ? `<div class="foot">${v.foot}</div>` : ''}${v.flow || v.noNav ? '' : navPhone(sec_)}`;
  } else {
    const right = v.dright ?? v.right ?? bell();
    const bk = v.child || v.flow ? `<button type="button" class="back link" style="color:var(--texto-secundario)" data-a="back">${ic('arrowL', 18)}${v.back || 'Atrás'}</button>` : '';
    const dbody = v.dbody || body;
    inner = `${sidebar(v.dsec || sec_)}<div class="scr${top && UI.dir ? ' fz-d-' + (UI.dir === 'up' ? 'push' : UI.dir) : ''}"><div class="dtop">${bk ? `<div class="crumb">${bk}</div>` : ''}<h1>${v.title}</h1>${right}</div><main class="dcontent${v.flow || v.narrow ? ' flowd' : ''}${top ? ' stg' : ''}">${(fl && v.dbody) ? fl : ''}${dbody}${v.foot ? `<div class="foot"><div class="flowfoot">${v.foot}</div></div>` : ''}</main></div>`;
  }
  let over = '';
  if (UI.menu) over = `<div class="menu-catch" data-a="closeMenu"></div>${UI.menu}`;
  if (UI.notif && !v.access) over += v2NotifPanel();
  if (UI.sheet && !v.access) {
    let sh; try { sh = SHEETS[UI.sheet.n](UI.sheet.p); } catch (e) { console.error(e); sh = { title: 'Error', body: esc(e.message) }; }
    over += `<div class="velo fz-v-in" data-a="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(sh.title)}"><span class="handle"></span><div class="shead"><div><h2>${sh.title}</h2>${sh.sub ? `<p>${sh.sub}</p>` : ''}</div><button type="button" class="ib" aria-label="Cerrar" data-a="closeSheet" style="margin:-6px -10px 0 0">${ic('x', 20)}</button></div><div class="stack">${sh.body}</div>${sh.acts ? `<div class="stack" style="gap:8px">${sh.acts}</div>` : ''}</div>`;
  }
  root.className = 'device ' + (phone ? 'phone' : 'desk'); fitDevice();
  root.innerHTML = inner + over;
  const scr = root.querySelector('.scr'); if (scr && !top) scr.scrollTop = prevScroll;
  if (actId) { const el = document.getElementById(actId); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selS); } catch (e) {} } }
  if (top) UI.dir = null;
  if (UI._rollNext) { UI._rolled = true; UI._rollNext = false; }
  UI._amts = UI._amts || {};
  root.querySelectorAll('[data-amt]').forEach(el => { const k = el.dataset.amt, val = parseFloat(el.dataset.v); const prev = UI._amts[k];
    if (prev != null && Math.abs(prev - val) > 0.004 && !RM()) { const tgt = el.firstElementChild || el; tgt.classList.add(val > prev ? 'amt-up' : 'amt-down'); }
    UI._amts[k] = val; });
  const nP = C.pendientes.length; if (UI._lastN != null && UI._lastN !== nP) root.querySelectorAll('.nav .badge, .sidebar .n').forEach(b => b.classList.add('bump')); UI._lastN = nP;
  chrome(); guardar();
}

/* ------------------------------- eventos ---------------------------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.closest('.side, .bar') && !el.closest('#app')) { /* acciones de la demo */ }
  e.preventDefault();
  let p = null; try { p = JSON.parse(el.dataset.p || 'null'); } catch (x) {}
  const f = ACT[el.dataset.a]; if (f) f(p, el);
});
document.addEventListener('input', (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.f) return;
  if (/^d\d$/.test(el.id)) { el.value = el.value.replace(/\D/g, '').slice(-1); el.classList.remove('pop'); void el.offsetWidth; if (el.value) el.classList.add('pop');
    const nx = document.getElementById('d' + (+el.id[1] + 1)); if (el.value && nx) nx.focus(); }
  UI.F[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.live) render();
});
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset && el.dataset.f && el.type === 'checkbox') { UI.F[el.dataset.f] = el.checked; render(); } });
document.addEventListener('paste', (e) => {
  const el = e.target; if (!el || !/^d\d$/.test(el.id)) return;
  const t = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6); if (!t) return;
  e.preventDefault(); [...t].forEach((ch, i) => { const box = document.getElementById('d' + i); if (box) { box.value = ch; UI.F['d' + i] = ch; box.classList.remove('pop'); void box.offsetWidth; box.style.animationDelay = (i * 40) + 'ms'; box.classList.add('pop'); } });
  const last = document.getElementById('d' + Math.min(t.length, 5)); if (last) last.focus();
});
document.addEventListener('keydown', (e) => {
  const el = e.target; if (el && /^d\d$/.test(el.id) && e.key === 'Backspace' && !el.value) { const pv = document.getElementById('d' + (+el.id[1] - 1)); if (pv) { pv.focus(); pv.value = ''; UI.F[pv.id] = ''; e.preventDefault(); } }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (UI.sheet || UI.menu || UI.notif)) closeOverlay(() => { UI.sheet = null; UI.menu = null; UI.notif = false; }); });

Object.assign(ACT, {
  go: (p) => go(...p), nav: (k) => { UI.hist = []; UI.dirNext = dirFor(k, 'tab'); go(k); }, back: () => back(),
  sheet: (p) => sheet(p[0], p.slice(1)), closeSheet: () => closeSheet(), closeMenu: () => closeOverlay(() => { UI.menu = null; }),
  f: (p) => { UI.F[p[0]] = p[1]; render(); },          // fija un valor del formulario
  falta: (id) => go('falta', id),
});
const F = (k, d) => (UI.F[k] !== undefined ? UI.F[k] : d);
const num = (k, d = 0) => { const v = parseFloat(String(F(k, d)).replace(/,/g, '')); return isNaN(v) ? 0 : v; };

/* ----------------------------- menú K2 ------------------------------------ */
function openMenu(title, items) {
  UI.menu = `<div class="menu" role="menu" style="${UI.vista === 'telefono' ? 'top:116px' : 'right:40px;top:96px'}">${title ? `<div class="mh lbl">${title}</div>` : ''}${items.map(([i, l, a, p, mot, kind]) =>
    `<button type="button" role="menuitem" class="${kind === 'peligro' ? 'danger' : ''}"${a ? on(a, p) : ' aria-disabled="true"'}>${ic(i, 18)}<span class="tt">${l}${mot ? `<small>${mot}</small>` : ''}</span></button>`).join('')}</div>`;

/* La computadora se dibuja a 1440 × 900 (como en el tablero) y se escala para entrar en el espacio disponible. */
function fitDevice() {
  const fit = document.getElementById('fit'), app = document.getElementById('app'); if (!fit || !app) return;
  if (UI.vista !== 'computadora') { app.style.transform = ''; fit.style.width = ''; fit.style.height = ''; return; }
  const stage = fit.parentElement, side = document.getElementById('side');
  const avail = stage.clientWidth - (side && getComputedStyle(side).display !== 'none' && getComputedStyle(side).position !== 'fixed' ? side.offsetWidth + 24 : 0);
  const s = Math.min(1, avail / 1440);
  app.style.transform = `scale(${s})`; app.style.transformOrigin = 'top left';
  fit.style.width = Math.round(1440 * s) + 'px'; fit.style.height = Math.round(900 * s) + 'px';
}
window.addEventListener('resize', fitDevice);

const txt = (x, y, s, o = {}) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${o.a || 'middle'}" font-family="Archivo, system-ui, sans-serif" font-size="${o.fs || 11}" font-weight="${o.fw || 500}"${o.fst ? ` font-stretch="${o.fst}"` : ''} fill="${o.fill || 'var(--texto-secundario)'}" style="font-variant-numeric:tabular-nums">${s}</text>`;
/* hist: [[mes, asignado, gastado], ...] — barras en tinta con tope de asignado, rojas si se pasó */
function v2HistChart(hist, note) {
  const k = 'h' + (++_gid), W = 318, H = 172, base = 142, mx = Math.max(...hist.map(h => Math.max(h[1], h[2]))) * 1.15 || 1;
  const Y = (v) => base - v / mx * 112, slot = W / hist.length;

function qrSvg() { let s = 7, out = ''; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 625; i++) { const x = i % 25, y = (i / 25) | 0, f = (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17); if (f ? ((x % 6 === 0 || y % 6 === 0 || (x > 1 && x < 5 && ((y > 1 && y < 5) || (y > 19 && y < 23)))) || (x > 19 && x < 23 && y > 1 && y < 5) || ((x === 18 || x === 24) && y < 7) || ((y === 18 || y === 24) && x < 7)) : rnd() > .55) out += `<rect x="${x * 6}" y="${y * 6}" width="6" height="6"/>`; }
  return `<div class="qr"><svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Código QR para tu app de autenticación" fill="#101418">${out}</svg></div>`; }

/* --------------------------- Revisar movimiento --------------------------- */
SCR.revisar = ([id]) => {
  const b = S.bandeja.find(x => x.id === id); if (!b) return SCR.falta(['?']);
  const cl = b.clase, [s, l] = CLASE[claseDe(b)];
  const smsBox = `<div class="sms"><span class="hrow" style="gap:8px;color:var(--texto-secundario)">${ic('sms', 16)}<span class="lbl">SMS de ${b.banco} · ${b.llegada}</span></span>“${esc(b.texto)}”</div>`;
  const head = `<div class="stack" style="gap:8px">${ind(s, b.estado === 'aprobado' ? 'Aprobado' : b.estado === 'descartado' ? 'Descartado' : l)}<h2 class="t-titulo-seccion" style="margin:0">${esc(b.comercio || 'SMS de ' + b.banco)}</h2>${b.monto ? `<span class="big">${fmt(-b.monto)}</span>` : ''}<span class="muted">${b.cuenta ? cuName(b.cuenta) + ' · ' + fdate(b.fecha) : b.llegada}</span></div>`;
  const ro = b.estado !== 'pendiente';
  let parts = [head], foot;
  if (b.estado === 'aprobado') {
    const t = S.transacciones.find(x => x.id === b.tx);
    parts.push(res(`Aprobado: ${esc(b.comercio)} · ${fmt(b.monto)} · ${cuName(b.cuenta)} · ${t ? (t.lineas.length > 1 ? 'Dividido en ' + t.lineas.length + ' partes' : catName(t.lineas[0].cat)) : ''}`, [['Ver transacción', 'go', ['transaccion', b.tx]]]));
    const tiene = t && t.lineas.length === 1 && S.reglas.some(r => t.comercio.includes(r.patron));
    if (t && t.lineas.length === 1 && !tiene) parts.push(surf(`<b>¿Siempre a ${catName(t.lineas[0].cat)}?</b><p class="muted">Creá una regla y la próxima compra en ${esc(b.comercio)} se propone sola.</p><div class="hrow">${btn('Crear regla', 's', 'crearRegla', b.id, { sm: true })}${btn('Ahora no', 'g', 'back', null, { sm: true })}</div>`));
    const sig = C.pendientes[0];
    foot = sig ? btn('Siguiente movimiento', 'p', 'replaceRev', sig.id, { full: true, ic: 'arrowR' }) : btn('Volver a la Bandeja', 's', 'back', null, { full: true });
    return { title: 'Revisar movimiento', flow: true, body: parts.join(''), foot };
  }
  if (b.estado === 'descartado') { parts.push(aviso('cero', 'Este movimiento ya está descartado.'), smsBox); return { title: 'Revisar movimiento', flow: true, body: parts.join(''), foot: btn('Restaurar', 'p', 'restaurarRev', b.id, { full: true, ic: 'undo' }) }; }
  if (cl === 'noreconocido') {
    parts.push(smsBox, aviso('cero', `No encontramos un formato de ${b.banco} que lea este SMS. Podés registrarlo a mano con el texto a la vista o descartarlo.`), nota(`Si corregís el formato en Ajustes › Formatos, este SMS se puede volver a procesar. ${link('Ver cómo', 'falta', 'reprocesar')}`));
    foot = btn('Registrar a mano', 'p', 'go', ['registrarGasto', { sms: b.id }], { full: true }) + btn('Descartar', 'g', 'descartar', b.id, { full: true, ic: 'trash' });
    return { title: 'Revisar movimiento', flow: true, body: parts.join(''), foot };
  }
  if (cl === 'error') {
    parts.push(smsBox, aviso('problema', 'Algo falló al procesar este SMS. No se registró nada. Podés intentarlo de nuevo; si vuelve a fallar, guardá la referencia.', 'Algo falló al procesarlo', [], 'alert'),
      surf(`<div class="hrow" style="justify-content:space-between;flex-wrap:nowrap"><span class="stack" style="gap:2px"><span class="lbl">Referencia</span><b class="num" style="letter-spacing:.06em">${b.referencia}</b></span>${btn('Copiar referencia', 's', 'copiar', b.referencia, { sm: true, ic: 'copy' })}</div>`, 'padding:8px 8px 8px 16px'),
      `<p class="muted">La misma referencia aparece en Ajustes › Diagnóstico.</p>`);
    foot = btn('Intentar de nuevo', 'p', 'reintentar', b.id, { full: true, ic: 'refresh' }) + btn('Descartar', 'g', 'descartar', b.id, { full: true, ic: 'trash' });
    return { title: 'Revisar movimiento', flow: true, body: parts.join(''), foot };
  }
  if (cl === 'coincidencia') {
    const p = S.programadas.find(x => x.id === b.programada);
    parts.push(smsBox, aviso('informacion', 'Este SMS coincide con un pago programado. Al confirmarlo se registra esa ocurrencia y no se crea otra transacción.', `Coincide con ${p ? p.nombre : 'una programada'} del ${p ? fdate(p.proxima) : ''}`),
      surf(kvs([['Programada', p?.nombre || '—'], ['Fecha esperada', p ? fdateY(p.proxima) : '—'], ['Monto esperado', fmt(p?.monto || 0)], ['Cuenta', cuName(p?.cuenta)], ['Categoría', catName(p?.cat)]]), 'padding:4px 16px'),
      nota('Un movimiento con coincidencia no se descarta: si no es este pago, se revisa como un gasto nuevo.'));
    foot = btn('Confirmar', 'p', 'aprobarRev', b.id, { full: true }) + btn('No es este pago', 's', 'noEsPago', b.id, { full: true });
    return { title: 'Revisar movimiento', flow: true, body: parts.join(''), foot };
  }
  if (cl === 'duplicado') {
    const t = S.transacciones.find(x => x.id === b.duplicadoDe);
    parts.push(smsBox, aviso('advertencia', 'Ya hay un gasto igual en la misma cuenta, el mismo día y por el mismo monto.', 'Igual a un gasto del ' + fdate(b.fecha)), t ? list([txRow(t)]) : '');
    foot = btn('Es otro gasto', 'p', 'otroGasto', b.id, { full: true }) + btn('Es duplicado', 's', 'descartar', b.id, { full: true }) + '<p class="tiny" style="text-align:center">“Es duplicado” lo descarta; se puede restaurar desde Descartados.</p>';
    return { title: 'Revisar movimiento', flow: true, body: parts.join(''), foot };
  }
  // listo / falta: formulario completo
  const cat = F('cat_' + b.id, b.sugerida);
  const dividir = F('div_' + b.id, false);
  const lineas = dividir ? [{ cat, monto: num('m1', r2(b.monto - 10)) }, { deudor: F('deu', 'Carlos'), monto: num('m2', 10) }] : null;
  const suma = lineas ? r2(lineas.reduce((s_, x) => s_ + x.monto, 0)) : b.monto;
  const lineErr = dividir && Math.abs(suma - b.monto) > 0.004 ? `Las partes suman ${fmt(suma)}; el movimiento es de ${fmt(b.monto)}.` : null;
  parts.push(smsBox,
    sel('Cuenta', cuName(b.cuenta), C.cuentas[b.cuenta]?.tipo === 'tarjeta' ? 'Deuda ' + fmt(C.cuentas[b.cuenta].deuda) : 'Saldo ' + fmt(C.cuentas[b.cuenta]?.saldo || 0), 'sheet', ['elegirCuenta', 'bcu'], { ic: C.cuentas[b.cuenta]?.tipo === 'tarjeta' ? 'card' : 'bank' }),
    `<div class="grid2">${fld('bf', 'Fecha', fdateY(b.fecha), { hint: null })}${fld('bm', 'Monto', b.monto.toFixed(2), { pre: '$', num: true })}</div>`,
    fld('bco', 'Comercio', b.comercio),
    !dividir ? sel('Categoría', cat ? catName(cat) : 'Elegí una categoría o por cobrar', cat ? 'Disponible ' + fmt(C.cats[cat]?.disponible || 0) + (b.regla && cat === b.sugerida ? ' · por la regla “' + S.reglas.find(r => r.id === b.regla)?.patron + '”' : '') : null, 'sheet', ['elegirCat', 'cat_' + b.id], { ph: !cat })
      : `<div class="stack" style="gap:12px">${sel('Parte 1', catName(cat), null, 'sheet', ['elegirCat', 'cat_' + b.id])}${fld('m1', 'Monto de la parte 1', lineas[0].monto.toFixed(2), { pre: '$', num: true, live: true })}${sel('Parte 2', esc(F('deu', 'Carlos')) + ' (me lo debe)', 'Por cobrar', null)}${fld('m2', 'Monto de la parte 2', lineas[1].monto.toFixed(2), { pre: '$', num: true, live: true })}${lineErr ? fmsg(lineErr) : `<p class="fhint">Suma de las partes ${fmt(suma)} de ${fmt(b.monto)}</p>`}</div>`,
    `<div>${link(dividir ? 'Volver a una sola categoría' : 'Dividir en partes', 'f', ['div_' + b.id, !dividir], dividir ? 'x' : 'plus')}</div>`,
    !dividir && cl === 'falta' ? chk('rec_' + b.id, F('rec_' + b.id, true), 'Recordar esta categoría para este comercio', 'Crea una regla: la próxima vez se propone sola.') : (dividir ? nota('Con más de una parte no se ofrece “Recordar esta categoría”.') : ''),
    fld('bn', 'Nota', '', { opt: true, ph: 'Hasta 500 caracteres' }));
  if (cat && !dividir) { const k = C.cats[cat], cu = C.cuentas[b.cuenta];
    parts.push(surf(`<span class="lbl">Después de aprobar</span>${kvs([[k.nombre + ' · Disponible', `${fmt(k.disponible)} → ${fmt(k.disponible - b.monto)}`], cu.tipo === 'tarjeta' ? [cu.nombre + ' · deuda', `${fmt(cu.deuda)} → ${fmt(cu.deuda + b.monto)}`] : [cu.nombre + ' · saldo', `${fmt(cu.saldo)} → ${fmt(cu.saldo - b.monto)}`]])}`, 'gap:4px')); }
  foot = btn('Aprobar ' + fmt(b.monto), 'p', 'aprobarRev', b.id, { full: true, dis: (!cat && !dividir) || !!lineErr, motive: lineErr ? 'Corregí los montos de las partes.' : 'Elegí una categoría o un por cobrar para aprobar.' }) + btn('Descartar', 'g', 'descartar', b.id, { full: true, ic: 'trash' });
  const i = C.pendientes.findIndex(x => x.id === b.id);
  return { title: 'Revisar movimiento', flow: true, right: i > -1 ? `<span class="tiny num" style="padding:0 12px;white-space:nowrap">${i + 1} de ${C.pendientes.length}</span>` : '', body: parts.join(''), foot, dsec: 'bandeja' };
};
ACT.aprobarRev = (id) => {
  const b = S.bandeja.find(x => x.id === id);
  if (b.clase === 'coincidencia') { A.aprobar(S, b, { cat: b.sugerida }); return render(); }
  const cat = F('cat_' + id, b.sugerida), dividir = F('div_' + id, false);
  A.aprobar(S, b, { cat, recordar: !dividir && b.clase === 'falta' && F('rec_' + id, true), lineas: dividir ? [{ cat, monto: num('m1', r2(b.monto - 10)) }, { deudor: F('deu', 'Carlos'), monto: num('m2', 10) }] : null });
  render();
};
ACT.replaceRev = (id) => replace('revisar', id);
ACT.descartar = (id) => { const b = S.bandeja.find(x => x.id === id); A.descartar(S, b); UI.hist = []; replace('bandeja'); flash(res(`Descartaste ${esc(b.comercio || 'el SMS de ' + b.banco)}${b.monto ? ' ' + fmt(-b.monto) : ''}.`, [['Restaurar', 'restaurar', id, 'undo']], 'trash'), 'bandeja'); render(); };
ACT.restaurarRev = (id) => { A.restaurar(S, S.bandeja.find(x => x.id === id)); render(); };
ACT.noEsPago = (id) => { const b = S.bandeja.find(x => x.id === id); b.clase = 'falta'; b.programada = null; render(); };
ACT.otroGasto = (id) => { const b = S.bandeja.find(x => x.id === id); b.clase = 'listo'; render(); };
ACT.reintentar = (id) => { flash(aviso('problema', 'Volvió a fallar. Guardá la referencia y descartalo, o probá más tarde.', 'Sigue con error', [], 'alert')); render(); };
ACT.crearRegla = (id) => { const b = S.bandeja.find(x => x.id === id), t = S.transacciones.find(x => x.id === b.tx); S.reglas.push({ id: nid(S, 'r'), patron: b.comercio.split(' ').slice(0, 2).join(' '), cat: t.lineas[0].cat, usos: 1 }); flash(res('Creaste la regla. La próxima compra ahí se propone sola.', [['Ver reglas', 'go', ['reglas']]])); render(); };

/* elegir categoría / cuenta (hojas de selección) */
SHEETS.elegirCat = ([key]) => ({ title: 'Elegí la categoría', body: S.grupos.map(g => { const ks = S.categorias.filter(k => k.grupo === g.id && !k.archivada && !k.pagoDe); return ks.length ? `<div class="grp"><div class="gh"><span class="lbl">${esc(g.nombre)}</span></div>${list(ks.map(k => opt(F(key) === k.id, esc(k.nombre), 'Disponible ' + fmt(C.cats[k.id].disponible), 'pick', [key, k.id])))}</div>` : ''; }).join('') || empty('grid', 'No hay categorías', 'Creá tus categorías primero.', btn('Crear las categorías', 'p', 'go', ['estructura'])) });
SHEETS.elegirCuenta = ([key, tipos]) => ({ title: 'Elegí la cuenta', body: list(S.cuentas.filter(c => !c.archivada && (!tipos || tipos.includes(c.tipo))).map(c => opt(F(key) === c.id, esc(c.nombre), (c.tipo === 'tarjeta' ? 'Deuda ' + fmt(C.cuentas[c.id].deuda) : 'Saldo ' + fmt(C.cuentas[c.id].saldo)), 'pick', [key, c.id]))) });
ACT.pick = ([k, v]) => { UI.F[k] = v; UI.sheet = null; render(); };

/* ------------------------------- Registrar -------------------------------- */
SCR.registrar = () => {
  const tieneTj = S.cuentas.filter(c => c.tipo === 'tarjeta').length, ef = S.cuentas.filter(c => c.tipo === 'efectivo').length;
  const tipos = [['out', 'Gasto', 'Con división y por cobrar', ['go', ['registrarGasto']]], ['in', 'Ingreso', 'Entra a Listo para asignar', ['sheet', ['regIngreso']]], ef > 1 && ['swap', 'Transferencia', 'Entre tus cuentas de efectivo', ['sheet', ['regTransf']]],
    tieneTj && ['card', 'Pago de tarjeta', 'Desde una cuenta de efectivo', ['sheet', ['pagarTj', S.cuentas.find(c => c.tipo === 'tarjeta').id]]], ['undo', 'Devolución', 'De una compra', ['noimplS', ['Devolución', 'tableros 03 y 12']]]].filter(Boolean);
  if (!S.cuentas.length) return { title: 'Registrar', flow: true, body: empty('wallet', 'Primero, una cuenta', 'Para registrar un gasto o un ingreso necesitás al menos una cuenta.', btn('Crear una cuenta', 'p', 'go', ['cuentaNueva'])) };
  return { title: 'Registrar', flow: true, body: `<h2 class="t-titulo-seccion" style="margin:0">¿Qué querés registrar?</h2><div class="grid2">${tipos.map(([i, t, s, a]) => `<button type="button" class="tcard" data-a="${a[0]}" data-p="${P(a[1])}">${disc(i, t === 'Gasto' ? 'background:var(--accion-tonal);color:var(--accion)' : '')}<span class="stack" style="gap:2px"><b>${t}</b><span>${s}</span></span></button>`).join('')}</div><p class="tiny">Solo aparecen los tipos que tus cuentas permiten.</p>` };
};
SCR.registrarGasto = ([o]) => {
  const desdeSms = o && o.sms ? S.bandeja.find(b => b.id === o.sms) : null;
  const cu = F('rcu', S.cuentas.find(c => !c.archivada)?.id), monto = num('rm', 0), err = F('_err'), c = C.cuentas[cu];
  const lines = UI.F.rl || (UI.F.rl = [{ cat: null, deudor: null, m: '' }]);
  const div = lines.length > 1 || lines[0].deudor;
  const vals = lines.map((l, i) => i === 0 && !div ? monto : num('rlm' + i, l.m || 0));
  const suma = r2(vals.reduce((s, x) => s + x, 0)), falta = r2(monto - suma);
  const lineRow = (l, i) => {
    const k = l.cat && C.cats[l.cat];
    const selH = l.deudor ? fld('rld' + i, 'Quién te lo debe', F('rld' + i, l.deudor), { ph: 'Nombre' })
      : `<button type="button" class="sel${k ? '' : ' ph'}${err && !k ? ' err' : ''}" data-a="sheet" data-p="${P(['elegirCatL', i])}"><span class="v"><b>${k ? esc(k.nombre) : 'Categoría'}</b>${k ? `<span class="num">Disponible ${fmt(k.disponible)}</span>` : ''}</span>${ic('chevD', 18)}</button>`;
    if (!div) return `<div class="fld"><span class="flab">Categoría</span>${selH}${err && !k ? fmsg('Elegí una categoría para guardar.') : ''}</div>`;
    return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:8px;align-items:${l.deudor ? 'end' : 'center'};animation:fz-item var(--duracion-normal) var(--curva-estandar) both">${selH}<div class="box"><span class="pre">$</span><input id="rlm${i}" data-f="rlm${i}" data-live="1" inputmode="decimal" value="${esc(F('rlm' + i, l.m))}" placeholder="0.00" style="text-align:right" aria-label="Monto de la línea ${i + 1}"></div><button type="button" class="ib" aria-label="Quitar línea ${i + 1}" data-a="rlQuitar" data-p="${i}">${ic('x', 18)}</button></div>`;
  };
  const parts = [desdeSms ? `<div class="sms"><span class="lbl">SMS de ${desdeSms.banco}</span>“${esc(desdeSms.texto)}”</div>` : '',
    sel('Cuenta', cuName(cu), c ? (c.tipo === 'tarjeta' ? 'Deuda ' + fmt(c.deuda) : 'Saldo ' + fmt(c.saldo)) : '', 'sheet', ['elegirCuenta', 'rcu'], { ic: c?.tipo === 'tarjeta' ? 'card' : 'bank' }),
    `<div class="grid2">${fld('rf', 'Fecha', F('rf', '15/10/2026'), { hint: 'Hoy' })}${fld('rm', 'Total', F('rm', ''), { pre: '$', num: true, live: true, ph: '0.00', err: err && !monto ? 'Escribí el total.' : null })}</div>`,
    fld('rco', 'Comercio', F('rco', ''), { ph: 'Dónde compraste' }),
    div ? `<section class="sec"><div class="sech"><h2>Dividir</h2><span class="tiny">${lines.length} líneas</span></div>${lines.map(lineRow).join('')}<div class="hrow" style="justify-content:center">${link('Agregar línea', 'rlAgregar', 'cat', 'plus')}${link('Alguien me lo debe', 'rlAgregar', 'deudor', 'user')}</div><div class="kv" style="border-top:1px solid var(--borde-sutil)"><span>Suma de las líneas</span><b>${fmt(suma)} <span style="font-weight:400;color:var(--texto-secundario)">de ${fmt(monto)}</span></b></div>${Math.abs(falta) > 0.004 && monto ? fmsg(falta > 0 ? `Faltan ${fmt(falta)} por repartir entre las líneas.` : `Las líneas suman ${fmt(-falta)} más que el total.`) : ''}</section>`
      : lineRow(lines[0], 0) + `<div class="hrow">${link('Dividir', 'rlAgregar', 'cat', 'plus')}${link('Alguien me lo debe', 'rlAgregar', 'deudor', 'user')}</div>`,
    fld('rn', 'Nota', F('rn', ''), { opt: true, ph: 'Hasta 500 caracteres' })];
  if (monto && c && lines.some(l => l.cat)) { const imp = lines.map((l, i) => { if (l.deudor) return [`${esc(F('rld' + i, l.deudor) || 'Alguien')} te debe`, `→ ${fmt(vals[i])}`]; const k = C.cats[l.cat]; return k ? [esc(k.nombre) + ' · Disponible', `${fmt(k.disponible)} → ${fmt(k.disponible - vals[i])}`] : null; }).filter(Boolean);
    parts.push(surf(`<span class="lbl">Antes de guardar</span>${kvs([[c.nombre + (c.tipo === 'tarjeta' ? ' · deuda' : ''), c.tipo === 'tarjeta' ? `${fmt(c.deuda)} → ${fmt(c.deuda + monto)}` : `${fmt(c.saldo)} → ${fmt(c.saldo - monto)}`], ...imp])}`, 'gap:4px')); }
  parts.push(link('Hay un borrador guardado de otro día', 'falta', 'borrador', 'clock'));
  const bad = div && Math.abs(falta) > 0.004;
  return { title: 'Registrar gasto', flow: true, body: parts.join(''), foot: btn(monto ? 'Guardar ' + fmt(monto) : 'Guardar', 'p', 'guardarGasto', o || null, { full: true, dis: bad, motive: 'La suma de las líneas tiene que dar el total.' }), dsec: 'inicio' };
};
SHEETS.elegirCatL = ([i]) => ({ title: 'Elegí la categoría', body: S.grupos.map(g => { const ks = S.categorias.filter(k => k.grupo === g.id && !k.archivada && !k.pagoDe); return ks.length ? `<div class="grp"><div class="gh"><span class="lbl">${esc(g.nombre)}</span></div>${list(ks.map(k => opt(UI.F.rl[i].cat === k.id, esc(k.nombre), 'Disponible ' + fmt(C.cats[k.id].disponible), 'pickL', [i, k.id])))}</div>` : ''; }).join('') });
ACT.pickL = ([i, id]) => { UI.F.rl[i].cat = id; closeOverlay(() => { UI.sheet = null; }); };
ACT.rlAgregar = (kind) => { const L = UI.F.rl; if (L.length === 1 && !L[0].deudor && UI.F.rm) { UI.F.rlm0 = UI.F.rlm0 || UI.F.rm; } L.push(kind === 'deudor' ? { deudor: 'Carlos', m: '' } : { cat: null, m: '' }); render(); };
ACT.rlQuitar = (i) => { UI.F.rl.splice(i, 1); for (let j = i; j < UI.F.rl.length + 1; j++) { UI.F['rlm' + j] = UI.F['rlm' + (j + 1)]; UI.F['rld' + j] = UI.F['rld' + (j + 1)]; } if (!UI.F.rl.length) UI.F.rl.push({ cat: null, m: '' }); render(); };
ACT.guardarGasto = (o) => {
  const cu = F('rcu', S.cuentas.find(c => !c.archivada)?.id), monto = num('rm', 0), L = UI.F.rl || [{ cat: null }];
  const div = L.length > 1 || L[0].deudor;
  const lineas = L.map((l, i) => l.deudor ? { deudor: F('rld' + i, l.deudor) || 'Alguien', monto: num('rlm' + i, 0) } : { cat: l.cat, monto: div ? num('rlm' + i, 0) : monto });
  if (!monto || lineas.some(l => !l.deudor && !l.cat)) { UI.F._err = 1; return render(); }
  const t = A.registrar(S, { fecha: HOY, cuenta: cu, tipo: 'gasto', comercio: String(F('rco', '')).trim() || 'Gasto', lineas, origen: o && o.sms ? 'sms' : 'manual', nota: F('rn', '') });
  if (o && o.sms) { const b = S.bandeja.find(x => x.id === o.sms); b.estado = 'aprobado'; b.tx = t.id; }
  UI.hist = []; replace('inicio'); flash(res(`Guardaste ${esc(t.comercio)} · ${fmt(monto)}${lineas.length > 1 ? ' en ' + lineas.length + ' partes' : ' en ' + catName(lineas[0].cat)}.`, [['Ver transacción', 'go', ['transaccion', t.id]], ['Registrar otro', 'go', ['registrarGasto']]]), 'inicio'); render();
};

/* Gasto semanal conectado (D7): suma las transacciones de gasto por semana del período */
function semanas() {
  const asig = Object.values(C.cats).filter(k => !k.pagoDe).reduce((a, k) => a + k.asignado, 0), ref = r2(asig / 4.3);
  const sums = [0, 0, 0, 0, 0];
  S.transacciones.filter(t => t.tipo === 'gasto' && t.fecha.slice(0, 7) === HOY.slice(0, 7)).forEach(t => { const d = +t.fecha.slice(8, 10); sums[Math.min(4, Math.floor((d - 1) / 7))] += t.lineas.reduce((a, l) => a + (l.deudor ? 0 : l.monto), 0); });
  const hoyW = Math.min(4, Math.floor((+HOY.slice(8, 10) - 1) / 7));
  return sums.map((g, i) => ['sem ' + (i + 1), r2(g), ref, i > hoyW, i === hoyW]);
}
