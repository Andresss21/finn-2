.marco{position:relative;background:var(--fondo);color:var(--texto);box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.marco.tel{width:390px;border-radius:44px;box-shadow:0 0 0 1px var(--borde-sutil),0 28px 64px rgba(16,20,24,.18)}
.marco.pc{width:1440px;border-radius:14px;box-shadow:0 0 0 1px var(--borde-sutil),0 28px 64px rgba(16,20,24,.14)}
.marco.fijo{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.marco.arrastrando,.marco.arrastrando *{cursor:grabbing !important;user-select:none;-webkit-user-select:none}
:where(.marco) button{font:inherit;color:inherit}
.btn0{border:none;background:transparent;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-appearance:none;appearance:none}
.btn0:focus-visible,.enlace-btn:focus-visible,.btn-tonal:focus-visible,.seg:focus-visible,.alternar:focus-visible{outline:2px solid var(--foco);outline-offset:2px;border-radius:10px}
.enlace-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px;border:none;background:transparent;cursor:pointer;font-family:'Archivo',sans-serif;font-weight:700;font-size:.875rem;line-height:1.35;color:var(--enlace);white-space:nowrap}
.rotulo{font-family:'Archivo',sans-serif;font-weight:600;font-size:.75rem;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-secundario)}
.cuenta{font-family:'Archivo',sans-serif;font-weight:500;font-size:.8125rem;color:var(--texto-terciario);white-space:nowrap}
.tarjeta{background:var(--superficie);border-radius:16px;box-shadow:var(--elevacion-1);overflow:hidden;transition:box-shadow var(--duracion-rapida) var(--curva-estandar)}
.tarjeta.destino{box-shadow:0 0 0 2px var(--accion),var(--elevacion-2)}
.enc-grupo{display:flex;align-items:center;gap:0;min-height:44px;border-radius:12px;transition:background var(--duracion-rapida) var(--curva-estandar)}
.enc-grupo.enc-sobre{background:var(--accion-tonal);box-shadow:inset 0 0 0 2px var(--accion)}
.alternar{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:44px;padding:0 6px;border:none;background:transparent;cursor:pointer;text-align:left;border-radius:10px}
.chev{display:flex;flex:none;transition:transform var(--duracion-normal) var(--curva-estandar)}
.enc-dentro{display:flex;align-items:center;gap:0;min-height:60px;padding:4px 4px 4px 6px;border-bottom:1px solid var(--borde-sutil)}
.enc-dentro .nombre-g{font-family:'Archivo',sans-serif;font-weight:700;font-size:1rem;color:var(--texto)}
.fila-cat{display:flex;align-items:center;gap:2px;min-height:56px;padding:4px 6px 4px 16px;border-bottom:1px solid var(--borde-sutil);box-sizing:border-box;background:var(--superficie)}
.fila-cat.con-asa-izq{padding-left:4px}
.fila-cat.en-barra{background:var(--accion-tonal)}
.fila-btn{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:48px;border:none;background:transparent;cursor:pointer;text-align:left;padding:0;border-radius:8px}
.fila-btn:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.nombre{font-family:'Archivo',sans-serif;font-weight:600;font-size:1rem;line-height:1.5;color:var(--texto)}
.sub{font-family:'Archivo',sans-serif;font-weight:400;font-size:.875rem;line-height:1.45;color:var(--texto-secundario)}
.asa{width:44px;height:44px;flex:none;border:none;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;color:var(--texto-secundario);padding:0}
.asa:hover{background:var(--superficie-hundida);color:var(--texto)}
.asa:focus-visible{outline:2px solid var(--foco);outline-offset:-2px}
.asa-hover{opacity:0;transition:opacity var(--duracion-rapida) var(--curva-estandar)}
.fila-cat:hover .asa-hover,.enc-grupo:hover .asa-hover,.asa-hover:focus-visible,.ver-asa .asa-hover{opacity:1}
.ver-asa{background:var(--superficie-hundida)}
.hueco{margin:6px 8px;min-height:48px;border:2px dashed var(--borde-control);border-radius:12px;background:var(--superficie-hundida);box-sizing:border-box}
.hueco-grupo{min-height:48px;border:2px dashed var(--borde-control);border-radius:14px;background:var(--superficie-hundida);box-sizing:border-box}
.levantada{display:flex;align-items:center;gap:6px;min-height:56px;padding:4px 16px 4px 4px;background:var(--superficie-elevada);border-radius:12px;box-shadow:0 0 0 2px var(--accion),var(--elevacion-3);transform:scale(1.03);box-sizing:border-box;position:relative;z-index:3}
.levantada .asa{cursor:grabbing;color:var(--accion)}
.destino-txt{display:flex;align-items:center;gap:4px;font-family:'Archivo',sans-serif;font-weight:700;font-size:.8125rem;color:var(--accion)}
.flotante{position:absolute;z-index:40;pointer-events:none}
.resultado{display:flex;align-items:center;gap:10px;min-height:56px;padding:4px 4px 4px 14px;background:var(--positivo-fondo);border-bottom:1px solid var(--borde-sutil);box-sizing:border-box}
.resultado-txt{flex:1;min-width:0;font-family:'Archivo',sans-serif;font-weight:500;font-size:.875rem;line-height:1.4;color:var(--texto)}
.icono-btn{width:44px;height:44px;flex:none;border:none;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.icono-btn:focus-visible{outline:2px solid var(--foco);outline-offset:-2px}
.barra-mover{display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;background:var(--accion-tonal);border-bottom:1px solid var(--borde-sutil)}
.barra-fila{display:flex;flex-wrap:wrap;gap:8px}
.btn-tonal{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:none;background:var(--superficie);color:var(--accion);font-family:'Archivo',sans-serif;font-weight:700;font-size:.875rem;cursor:pointer;box-shadow:0 0 0 1px var(--borde-sutil)}
.btn-tonal[disabled]{color:var(--texto-deshabilitado);cursor:not-allowed;box-shadow:none;background:transparent}
.btn-principal{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:none;border-radius:12px;background:var(--accion);color:var(--texto-sobre-accion);font-family:'Archivo',sans-serif;font-weight:700;font-size:1rem;cursor:pointer}
.btn-principal:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.btn-ordenar{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:none;background:var(--accion-tonal);color:var(--accion);font-family:'Archivo',sans-serif;font-weight:700;font-size:.875rem;cursor:pointer;white-space:nowrap}

.btn-ordenar:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.nuevo-grupo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:none;border-radius:12px;background:var(--accion-tonal);color:var(--accion);font-family:'Archivo',sans-serif;font-weight:700;font-size:1rem;cursor:pointer}
.nueva-cat{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 16px;border:none;background:transparent;color:var(--enlace);font-family:'Archivo',sans-serif;font-weight:700;font-size:.875rem;cursor:pointer;text-align:left}
.nueva-cat:focus-visible,.nuevo-grupo:focus-visible{outline:2px solid var(--foco);outline-offset:-2px}
.resumen{display:flex;flex-direction:column;justify-content:center;gap:2px;width:100%;min-height:60px;padding:8px 16px;border:none;background:transparent;cursor:pointer;text-align:left;box-sizing:border-box}
.resumen:focus-visible{outline:2px solid var(--foco);outline-offset:-2px;border-radius:16px}
.pista{display:flex;align-items:center;gap:10px;padding:6px 4px 6px 14px;border-radius:14px;background:var(--informacion-fondo)}
.pista-txt{flex:1;font-family:'Archivo',sans-serif;font-weight:500;font-size:.875rem;line-height:1.4;color:var(--informacion-texto)}
.panel-lateral{width:360px;flex:none;display:flex;flex-direction:column;gap:20px;font-family:'Archivo',sans-serif;color:#101418}
.seg-grupo{display:flex;gap:2px;padding:3px;background:#E7E8E3;border-radius:11px}
.seg{min-height:40px;padding:0 14px;border:none;border-radius:8px;background:transparent;font-family:'Archivo',sans-serif;font-weight:500;font-size:.875rem;color:#101418;cursor:pointer;white-space:nowrap}
.seg.on{background:#FFFFFF;font-weight:700;box-shadow:0 0 0 1px #C9CCC4,0 1px 2px rgba(0,0,0,.08)}
.aparece{animation:aparecer var(--duracion-normal) var(--curva-enfasis)}
@keyframes aparecer{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.chev,.tarjeta,.enc-grupo,.asa-hover{transition:none}.aparece{animation:none}.levantada{transform:none}}
.marco.fijo .barra-listo{position:sticky}
.btn-tonal[aria-expanded="true"]{background:var(--accion);color:var(--texto-sobre-accion);box-shadow:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
